                                  .font(.system(size: 9, weight: .bold))
                                  .foregroundColor(.white.opacity(0.9))
                          }
                      }
                  }
                  .position(screenPt)
              }

              private func iconForKind(_ kind: ARTargetKind) -> String {
                  switch kind {
                  case .singleHandStrike: return "basketball.fill"
                  case .doubleHandBlock: return "hands.clap.fill"
                  case .lateralWingCone: return "cone.fill"
                  case .overheadHurdle: return "arrow.down.circle.fill"
                  case .fakeOutBomb: return "xmark.octagon.fill"
                  }
              }

              // MARK: - Game Loop & Collision Logic
              private func startCountdown() {
                  guard phase == .calibrating else { return }
                  phase = .countdown
                  countdownValue = 3
                  statusBanner = "3 秒倒计时准备！"
                  if store.soundEffectsEnabled {
                      SoundAndSpeechService.shared.playHitSound(combo: 3)
                  }
                  if store.voiceCoachEnabled {
                      SoundAndSpeechService.shared.speakCoach("三，二，一，开始！", rate: 0.55)
                  }
              }

              private func handleOneSecondTick() {
                  // Clean up old floating bursts
                  let now = Date()
                  hitBursts.removeAll { now.timeIntervalSince($0.createdAt) > 0.65 }

                  switch phase {
                  case .calibrating:
                      break
                  case .countdown:
                      if countdownValue > 1 {
                          countdownValue -= 1
                          if store.soundEffectsEnabled {
                              SoundAndSpeechService.shared.playMetronomeTick(isAccent: false)
                          }
                      } else {
                          phase = .activePlay
                          spawnNextTarget()
                      }
                  case .activePlay:
                      if remainingSeconds > 0 {
                          remainingSeconds -= 1
                      } else {
                          finishWorkout()
                      }
                  }
              }

              private func handlePhysicsAndCollisionTick() {
                  let handPoints = [
                      visionService.joints.leftPalmCenter,
                      visionService.joints.rightPalmCenter,
                      visionService.joints.leftWrist,
                      visionService.joints.rightWrist,
                      visionService.joints.nose
                  ].compactMap { $0 }

                  if phase == .calibrating {
                      // Check if player's hand touches the top green calibration node
                      let touchedStart = handPoints.contains { pt in
                          hypot(pt.x - startCircleNormalized.x, pt.y - startCircleNormalized.y) < 0.14
                      }
                      if touchedStart {
                          calibrationHoldProgress += 0.16
                          if calibrationHoldProgress >= 1.0 {
                              startCountdown()
                          }
                      } else {
                          calibrationHoldProgress = max(0.0, calibrationHoldProgress - 0.08)
                      }
                      return
                  }

                  guard phase == .activePlay, let target = currentTarget else { return }
                  let elapsedMs = Date().timeIntervalSince(target.spawnedAt) * 1000.0

                  // 1. Check Target Timeout
                  if elapsedMs >= difficulty.targetTimeoutMs {
                      if target.kind == .fakeOutBomb {
                          // Player disciplined: resisted fake-out bomb!
                          score += 75
                          hits += 1
                          combo += 1
                          maxCombo = max(maxCombo, combo)
                          appendBurst(at: target.position, text: "识破假动作 +75", color: .green)
                          statusBanner = "好眼力！成功忍住未碰假动作陷阱 (+75)"
                      } else {
                          misses += 1
                          combo = 0
                          samples.append(SplitReactionSample(index: samples.count + 1, reactionMs: Int(difficulty.targetTimeoutMs), isLeftHandOrSide: target.isLeftSide, wasHit: false))
                          if store.soundEffectsEnabled {
                              SoundAndSpeechService.shared.playMissOrBombSound()
                          }
                          appendBurst(at: target.position, text: "MISS 超时!", color: .red)
                          statusBanner = "启动偏慢！紧盯靶标加快出手速度！"
                      }
                      spawnNextTarget()
                      return
                  }

                  // 2. Check Pose Collisions by Target Kind
                  switch target.kind {
                  case .overheadHurdle:
                      // Player ducks nose below Y = 0.52
                      if let nosePt = visionService.joints.nose, nosePt.y > 0.52 {
                          triggerTargetHit(target: target)
                      }
                  case .doubleHandBlock:
                      if let sec = target.secondaryPosition {
                          let hitFirst = handPoints.contains { hypot($0.x - target.position.x, $0.y - target.position.y) < 0.15 }
                          let hitSecond = handPoints.contains { hypot($0.x - sec.x, $0.y - sec.y) < 0.15 }
                          if hitFirst && hitSecond {
                              triggerTargetHit(target: target)
                          }
                      }
                  case .lateralWingCone:
                      let hitByHand = handPoints.contains { hypot($0.x - target.position.x, $0.y - target.position.y) < 0.15 }
                      let hitByBodySlide: Bool = {
                          guard let cx = visionService.joints.bodyCenterX else { return false }
                          return abs(cx - target.position.x) < 0.16 && visionService.joints.isStanceLowEnough
                      }()
                      if hitByHand || hitByBodySlide {
                          triggerTargetHit(target: target)
                      }
                  case .singleHandStrike, .fakeOutBomb:
                      if handPoints.contains(where: { hypot($0.x - target.position.x, $0.y - target.position.y) < 0.145 }) {
                          triggerTargetHit(target: target)
                      }
                  }
              }

              private func triggerTargetHit(target: ARVirtualTarget) {
                  let reactionMs = max(115, Int(Date().timeIntervalSince(target.spawnedAt) * 1000.0))

                  if target.kind == .fakeOutBomb {
                      misses += 1
                      combo = 0
                      score = max(0, score - 90)
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                      appendBurst(at: target.position, text: "误触陷阱 -90", color: .red)
                      statusBanner = "被假动作骗了！红色靶标严禁触碰 (-90)"
                      spawnNextTarget()
                      return
                  }

                  hits += 1
                  combo += 1
                  maxCombo = max(maxCombo, combo)
                  samples.append(SplitReactionSample(index: samples.count + 1, reactionMs: reactionMs, isLeftHandOrSide: target.isLeftSide, wasHit: true))

                  let speedBonus = max(25, Int((difficulty.targetTimeoutMs - Double(reactionMs)) / 10.0))
                  let points = 100 + speedBonus + (combo * 15)
                  score += points

                  if store.soundEffectsEnabled {
                      if target.kind == .doubleHandBlock {
                          SoundAndSpeechService.shared.playDoubleHitSound()
                      } else {
                          SoundAndSpeechService.shared.playHitSound(combo: combo)
                      }
                  }

                  appendBurst(at: target.position, text: "\(reactionMs)ms +\(points)", color: .cyan)
                  statusBanner = "极速命中！反应耗时 \(reactionMs)ms (连击 x\(combo))"
                  spawnNextTarget()
              }

              private func appendBurst(at point: CGPoint, text: String, color: Color) {
                  let burst = HitBurstEffect(normalizedPoint: point, text: text, color: color, createdAt: Date())
                  hitBursts.append(burst)
              }

