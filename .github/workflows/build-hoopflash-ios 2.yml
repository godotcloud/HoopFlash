name: Build Basketball Speed Trainer iOS App (HoopFlash Pro 2.0 - HomeCourt AR Edition)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS IPA (Zero-Unzip Direct Download)
    runs-on: macos-15
    steps:
      - name: Checkout Repository (Optional)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Project Structure & Swift Source Code
        run: |
          rm -rf HoopFlashPro
          mkdir -p HoopFlashPro/Sources/Models
          mkdir -p HoopFlashPro/Sources/Services
          mkdir -p HoopFlashPro/Sources/Views
          mkdir -p HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset

          # 1. Generate Info.plist (Including UILaunchScreen for Full-Screen iPhone 13 Pro Max Display)
          cat << 'EOF' > HoopFlashPro/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>HoopFlash Pro</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>2.0.0</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>HoopFlash Pro 需要使用前置摄像头进行 HomeCourt 级 AI 骨骼姿态追踪，实时检测您的运球护球手触靶、横向滑步与敏捷跨步，所有视频均在设备端 Neural Engine 实时计算，绝不保存或上传。</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UIStatusBarStyle</key>
              <string>UIStatusBarStyleLightContent</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          # 2. Generate Programmatic App Icon
          cat << 'EOF' > generate_icon.swift
          import AppKit

          let size = CGSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

          let colorSpace = CGColorSpaceCreateDeviceRGB()
          let bgColors = [
              CGColor(red: 0.04, green: 0.06, blue: 0.11, alpha: 1.0),
              CGColor(red: 0.09, green: 0.13, blue: 0.22, alpha: 1.0)
          ] as CFArray
          if let gradient = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 1.0]) {
              ctx.drawLinearGradient(gradient, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])
          }

          // HomeCourt-style Neon AR Tracking Arc
          ctx.setStrokeColor(CGColor(red: 0.0, green: 0.92, blue: 1.0, alpha: 0.9))
          ctx.setLineWidth(30)
          ctx.strokeEllipse(in: CGRect(x: 110, y: 110, width: 804, height: 804))

          // Basketball Core
          let ballRect = CGRect(x: 220, y: 220, width: 584, height: 584)
          let ballColors = [
              CGColor(red: 1.0, green: 0.52, blue: 0.08, alpha: 1.0),
              CGColor(red: 0.85, green: 0.26, blue: 0.02, alpha: 1.0)
          ] as CFArray
          ctx.saveGState()
          ctx.addEllipse(in: ballRect)
          ctx.clip()
          if let ballGrad = CGGradient(colorsSpace: colorSpace, colors: ballColors, locations: [0.0, 1.0]) {
              ctx.drawRadialGradient(ballGrad, startCenter: CGPoint(x: 420, y: 620), startRadius: 40, endCenter: CGPoint(x: 512, y: 512), endRadius: 330, options: [])
          }
          ctx.setStrokeColor(CGColor(red: 0.08, green: 0.09, blue: 0.12, alpha: 0.92))
          ctx.setLineWidth(18)
          ctx.move(to: CGPoint(x: 220, y: 512))
          ctx.addLine(to: CGPoint(x: 804, y: 512))
          ctx.move(to: CGPoint(x: 512, y: 220))
          ctx.addLine(to: CGPoint(x: 512, y: 804))
          ctx.strokePath()
          ctx.strokeEllipse(in: CGRect(x: 90, y: 312, width: 350, height: 400))
          ctx.strokeEllipse(in: CGRect(x: 584, y: 312, width: 350, height: 400))
          ctx.restoreGState()

          image.unlockFocus()

          if let tiffData = image.tiffRepresentation,
             let bitmap = NSBitmapImageRep(data: tiffData),
             let pngData = bitmap.representation(using: .png, properties: [:]) {
              try? pngData.write(to: URL(fileURLWithPath: "HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          EOF
          swift generate_icon.swift
          rm -f generate_icon.swift

          cat << 'EOF' > HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > HoopFlashPro/Resources/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          # 3. Generate Models/DrillModels.swift
          cat << 'EOF' > HoopFlashPro/Sources/Models/DrillModels.swift
          import Foundation
          import SwiftUI

          enum DrillMode: String, CaseIterable, Identifiable, Codable {
              case ballHandlingStrike = "AR 运球护球手闪电触靶"
              case agilityLateralShuttle = "AR 边线折返与飞跃虚拟栏"
              case closeoutReadReact = "AR 扑防干扰与假动作识别"
              case courtPodReflex = "3x3 战术灯光矩阵 (免相机)"
              case dribbleRhythm = "高频碎步节拍与抬头视野"

              var id: String { rawValue }

              var badgeTag: String {
                  switch self {
                  case .ballHandlingStrike: return "HomeCourt 经典控球"
                  case .agilityLateralShuttle: return "HomeCourt 横移爆发"
                  case .closeoutReadReact: return "防守阅读 & 神经抑制"
                  case .courtPodReflex: return "桌面/地面触控模式"
                  case .dribbleRhythm: return "步频 & 抬头观察"
                  }
              }

              var subtitle: String {
                  switch self {
                  case .ballHandlingStrike:
                      return "一手原地运球，另一只手（护球手）凌空击碎屏幕四周随机刷新的 AR 悬浮靶标"
                  case .agilityLateralShuttle:
                      return "压低防守重心左右滑步触碰 AR 边线翼标，遇到黄色虚拟跨栏迅速起跳或下潜躲避"
                  case .closeoutReadReact:
                      return "根据颜色信号极速响应：绿靶单手封盖、蓝靶双手干扰、红靶假动作陷阱严禁触碰"
                  case .courtPodReflex:
                      return "无需摄像头支架，将手机平放地面或桌面，用双手直接拍击 9 宫格球场战术反应灯"
                  case .dribbleRhythm:
                      return "60-200 BPM 动态步频加速，边做碎步运球边抬头看清并点击屏幕闪现的教练手势数字"
                  }
              }

              var iconName: String {
                  switch self {
                  case .ballHandlingStrike: return "hand.Wave.fill"
                  case .agilityLateralShuttle: return "figure.run"
                  case .closeoutReadReact: return "bolt.shield.fill"
                  case .courtPodReflex: return "square.grid.3x3.fill"
                  case .dribbleRhythm: return "metronome.fill"
                  }
              }

              var usesARCamera: Bool {
                  switch self {
                  case .ballHandlingStrike, .agilityLateralShuttle, .closeoutReadReact:
                      return true
                  case .courtPodReflex, .dribbleRhythm:
                      return false
                  }
              }

              var themeColor: Color {
                  switch self {
                  case .ballHandlingStrike: return Color(red: 1.0, green: 0.48, blue: 0.12)
                  case .agilityLateralShuttle: return Color(red: 0.0, green: 0.85, blue: 0.96)
                  case .closeoutReadReact: return Color(red: 0.22, green: 0.92, blue: 0.52)
                  case .courtPodReflex: return Color(red: 0.98, green: 0.76, blue: 0.18)
                  case .dribbleRhythm: return Color(red: 0.72, green: 0.42, blue: 1.0)
                  }
              }

              var setupInstruction: String {
                  switch self {
                  case .ballHandlingStrike:
                      return "手机靠墙或放支架，后退 1.8 米入镜，举手触碰绿圈即可无接触开局"
                  case .agilityLateralShuttle:
                      return "手机竖放地面或桌面，保持屈膝低重心滑步，用双肩/双手撞击左右边线靶"
                  case .closeoutReadReact:
                      return "绿色单手扑防、蓝色双手高举同时触碰、红色假动作陷阱保持静止不碰"
                  case .courtPodReflex:
                      return "手机平放身前，绿灯单点、橙灯双击、红灯进攻犯规陷阱不碰"
                  case .dribbleRhythm:
                      return "跟随节拍声高频碎步，眼睛盯住屏幕中央手势数字并点击对应按钮"
                  }
              }
          }

          enum DifficultyTier: String, CaseIterable, Identifiable, Codable {
              case rookie = "新秀 U10"
              case allStar = "全明星 U13"
              case mvp = "职业 MVP"

              var id: String { rawValue }

              var targetTimeoutMs: Double {
                  switch self {
                  case .rookie: return 2300
                  case .allStar: return 1600
                  case .mvp: return 1100
                  }
              }

              var fakeBombProbability: Double {
                  switch self {
                  case .rookie: return 0.14
                  case .allStar: return 0.24
                  case .mvp: return 0.34
                  }
              }

              var baseBPM: Int {
                  switch self {
                  case .rookie: return 105
                  case .allStar: return 138
                  case .mvp: return 168
                  }
              }
          }

          struct SplitReactionSample: Codable, Identifiable {
              var id = UUID()
              let index: Int
              let reactionMs: Int
              let isLeftHandOrSide: Bool
              let wasHit: Bool
          }

          struct TrainingRecord: Identifiable, Codable {
              let id: UUID
              let date: Date
              let mode: DrillMode
              let difficulty: DifficultyTier
              let score: Int
              let hits: Int
              let misses: Int
              let avgReactionMs: Int
              let bestReactionMs: Int
              let leftAvgMs: Int
              let rightAvgMs: Int
              let maxCombo: Int
              let durationSeconds: Int
              let samples: [SplitReactionSample]

              var accuracyPercent: Int {
                  let total = hits + misses
                  guard total > 0 else { return 100 }
                  return Int((Double(hits) / Double(total)) * 100.0)
              }

              var agilityRating: String {
                  if avgReactionMs <= 0 { return "A 控球大师" }
                  if avgReactionMs < 380 && accuracyPercent >= 88 { return "SSS 闪电侠" }
                  if avgReactionMs < 480 && accuracyPercent >= 82 { return "SS 全明星后卫" }
                  if avgReactionMs < 620 && accuracyPercent >= 75 { return "S 精英先发" }
                  if avgReactionMs < 820 { return "A 潜力新星" }
                  return "B 扎实成长"
              }
          }

          struct AchievementBadge: Identifiable {
              let id: String
              let title: String
              let description: String
              let icon: String
              let isUnlocked: Bool
              let accent: Color
          }

          @MainActor
          final class TrainingStore: ObservableObject {
              @Published var records: [TrainingRecord] = []
              @Published var playerName: String = "篮球小飞侠"
              @Published var voiceCoachEnabled: Bool = true
              @Published var soundEffectsEnabled: Bool = true

              private let storageKey = "hoopflash.training.records.v2"

              init() {
                  load()
              }

              func addRecord(_ record: TrainingRecord) {
                  records.insert(record, at: 0)
                  if records.count > 80 {
                      records = Array(records.prefix(80))
                  }
                  save()
              }

              func clearRecords() {
                  records.removeAll()
                  save()
              }

              var totalSessions: Int { records.count }
              var totalHits: Int { records.reduce(0) { $0 + $1.hits } }

              var bestReactionEverMs: Int {
                  let valid = records.map { $0.bestReactionMs }.filter { $0 > 0 }
                  return valid.min() ?? 0
              }

              var averageReactionRecentMs: Int {
                  let recent = records.prefix(10).map { $0.avgReactionMs }.filter { $0 > 0 }
                  guard !recent.isEmpty else { return 0 }
                  return recent.reduce(0, +) / recent.count
              }

              var xpLevel: Int {
                  max(1, (totalHits / 25) + 1)
              }

              var xpProgress: Double {
                  Double(totalHits % 25) / 25.0
              }

              var badges: [AchievementBadge] {
                  [
                      AchievementBadge(
                          id: "first_step",
                          title: "HomeCourt 破冰首训",
                          description: "完成首场 AR 视觉或敏捷反应特训",
                          icon: "flame.fill",
                          isUnlocked: totalSessions >= 1,
                          accent: .orange
                      ),
                      AchievementBadge(
                          id: "sub_350",
                          title: "0.35秒超神神经反射",
                          description: "单次最快触靶反应突破 350ms 以内",
                          icon: "bolt.circle.fill",
                          isUnlocked: bestReactionEverMs > 0 && bestReactionEverMs <= 350,
                          accent: .yellow
                      ),
                      AchievementBadge(
                          id: "combo_15",
                          title: "脚踝终结者 15连击",
                          description: "单局连续 15 次零失误极速命中靶标",
                          icon: "crown.fill",
                          isUnlocked: records.contains(where: { $0.maxCombo >= 15 }),
                          accent: .cyan
                      ),
                      AchievementBadge(
                          id: "ambidextrous",
                          title: "左右开弓均衡大师",
                          description: "单局左右手平均反应差距小于 45ms",
                          icon: "hands.sparkles.fill",
                          isUnlocked: records.contains(where: { $0.leftAvgMs > 0 && $0.rightAvgMs > 0 && abs($0.leftAvgMs - $0.rightAvgMs) <= 45 }),
                          accent: .green
                      ),
                      AchievementBadge(
                          id: "hundred_club",
                          title: "百次触靶里程碑",
                          description: "累计完成 100 次高速篮球敏捷反应触碰",
                          icon: "medal.fill",
                          isUnlocked: totalHits >= 100,
                          accent: .purple
                      )
                  ]
              }

              func save() {
                  if let encoded = try? JSONEncoder().encode(records) {
                      UserDefaults.standard.set(encoded, forKey: storageKey)
                  }
              }

              private func load() {
                  guard let data = UserDefaults.standard.data(forKey: storageKey),
                        let decoded = try? JSONDecoder().decode([TrainingRecord].self, from: data) else {
                      return
                  }
                  records = decoded
              }
          }
          EOF

          # 4. Generate Services/SoundAndSpeechService.swift (Crash-Safe Audio Synthesis & Speech)
          cat << 'EOF' > HoopFlashPro/Sources/Services/SoundAndSpeechService.swift
          import Foundation
          import AVFoundation
          import AudioToolbox
          import UIKit

          final class SoundAndSpeechService {
              static let shared = SoundAndSpeechService()

              private let synthesizer = AVSpeechSynthesizer()
              private let audioQueue = DispatchQueue(label: "com.hoopflash.audio.serialQueue", qos: .userInitiated)
              private var audioEngine: AVAudioEngine?
              private var playerNode: AVAudioPlayerNode?
              private var mixerFormat: AVAudioFormat?

              private init() {
                  audioQueue.async { [weak self] in
                      self?.setupEngineSafely()
                  }
              }

              private func setupEngineSafely() {
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(.ambient, mode: .default, options: [.mixWithOthers])
                      try session.setActive(true)

                      let engine = AVAudioEngine()
                      let node = AVAudioPlayerNode()
                      engine.attach(node)

                      // Critical crash fix: Always match mainMixerNode's native hardware channel & sample rate format
                      let hardwareFormat = engine.mainMixerNode.outputFormat(forBus: 0)
                      if hardwareFormat.sampleRate > 0 && hardwareFormat.channelCount > 0 {
                          engine.connect(node, to: engine.mainMixerNode, format: hardwareFormat)
                          try engine.start()
                          self.audioEngine = engine
                          self.playerNode = node
                          self.mixerFormat = hardwareFormat
                      }
                  } catch {
                      print("Safe audio fallback to system sounds: \(error)")
                  }
              }

              func playTone(frequency: Double, durationMs: Double, volume: Float = 0.40, isSquare: Bool = false) {
                  audioQueue.async { [weak self] in
                      guard let self = self else { return }
                      guard let engine = self.audioEngine,
                            let node = self.playerNode,
                            let format = self.mixerFormat else {
                          AudioServicesPlaySystemSound(1104)
                          return
                      }

                      if !engine.isRunning {
                          do {
                              try engine.start()
                          } catch {
                              AudioServicesPlaySystemSound(1104)
                              return
                          }
                      }

                      let sampleRate = format.sampleRate
                      let channels = Int(format.channelCount)
                      let frameCount = AVAudioFrameCount(max(1, Int((durationMs / 1000.0) * sampleRate)))
                      guard let buffer = AVAudioPCMBuffer(pcmFormat: format, frameCapacity: frameCount) else { return }
                      buffer.frameLength = frameCount

                      guard let floatChannels = buffer.floatChannelData else { return }
                      for i in 0..<Int(frameCount) {
                          let t = Double(i) / sampleRate
                          let attack = min(1.0, Double(i) / (sampleRate * 0.005))
                          let decay = max(0.0, 1.0 - (Double(i) / Double(frameCount)))
                          let env = Float(attack * decay)
                          let raw = sin(2.0 * .pi * frequency * t)
                          let val: Float = (isSquare ? (raw >= 0 ? 0.8 : -0.8) : Float(raw)) * volume * env
                          for ch in 0..<channels {
                              floatChannels[ch][i] = val
                          }
                      }

                      node.scheduleBuffer(buffer, at: nil, options: .interrupts, completionHandler: nil)
                      if !node.isPlaying {
                          node.play()
                      }
                  }
              }

              func playHitSound(combo: Int) {
                  let freq = min(1480.0, 620.0 + Double(combo * 38))
                  playTone(frequency: freq, durationMs: 75, volume: 0.45)
                  DispatchQueue.main.async {
                      let generator = UIImpactFeedbackGenerator(style: .rigid)
                      generator.impactOccurred()
                  }
              }

              func playDoubleHitSound() {
                  playTone(frequency: 880.0, durationMs: 65, volume: 0.45)
                  DispatchQueue.main.async {
                      let generator = UIImpactFeedbackGenerator(style: .heavy)
                      generator.impactOccurred()
                  }
              }

              func playMissOrBombSound() {
                  playTone(frequency: 150.0, durationMs: 210, volume: 0.55, isSquare: true)
                  DispatchQueue.main.async {
                      let generator = UINotificationFeedbackGenerator()
                      generator.notificationOccurred(.error)
                  }
              }

              func playMetronomeTick(isAccent: Bool) {
                  let freq = isAccent ? 987.77 : 659.25
                  playTone(frequency: freq, durationMs: 38, volume: isAccent ? 0.50 : 0.32)
              }

              func speakCoach(_ phrase: String, rate: Float = 0.55) {
                  DispatchQueue.main.async { [weak self] in
                      guard let self = self else { return }
                      if self.synthesizer.isSpeaking {
                          self.synthesizer.stopSpeaking(at: .immediate)
                      }
                      let utterance = AVSpeechUtterance(string: phrase)
                      utterance.voice = AVSpeechSynthesisVoice(language: "zh-CN")
                      utterance.rate = rate
                      utterance.pitchMultiplier = 1.05
                      utterance.volume = 0.95
                      self.synthesizer.speak(utterance)
                  }
              }

              func stopSpeech() {
                  DispatchQueue.main.async { [weak self] in
                      guard let self = self else { return }
                      if self.synthesizer.isSpeaking {
                          self.synthesizer.stopSpeaking(at: .immediate)
                      }
                  }
              }
          }
          EOF

          # 5. Generate Services/VisionPoseService.swift (Crash-Safe Single-Flight Frame Throttle + EMA Smoothing)
          cat << 'EOF' > HoopFlashPro/Sources/Services/VisionPoseService.swift
          import Foundation
          import AVFoundation
          import Vision
          import CoreGraphics
          import UIKit
          import SwiftUI

          struct DetectedBodyJoints {
              var leftWrist: CGPoint?
              var rightWrist: CGPoint?
              var leftElbow: CGPoint?
              var rightElbow: CGPoint?
              var nose: CGPoint?
              var leftShoulder: CGPoint?
              var rightShoulder: CGPoint?
              var rootHip: CGPoint?
              var leftKnee: CGPoint?
              var rightKnee: CGPoint?
              var leftAnkle: CGPoint?
              var rightAnkle: CGPoint?

              var hasVisibleUpperBody: Bool {
                  (nose != nil) && (leftShoulder != nil || rightShoulder != nil) && (leftWrist != nil || rightWrist != nil)
              }

              var bodyCenterX: CGFloat? {
                  if let ls = leftShoulder, let rs = rightShoulder {
                      return (ls.x + rs.x) * 0.5
                  }
                  if let hip = rootHip {
                      return hip.x
                  }
                  return nose?.x
              }

              var stanceLowScore: CGFloat {
                  guard let nosePt = nose else { return 0.5 }
                  return max(0.0, min(1.0, (nosePt.y - 0.20) / 0.36))
              }

              var isStanceLowEnough: Bool {
                  stanceLowScore >= 0.28
              }

              /// Estimated hand palm centers extending 28% beyond wrist from elbow (HomeCourt style hand-strike reach)
              var leftPalmCenter: CGPoint? {
                  guard let w = leftWrist else { return nil }
                  if let e = leftElbow {
                      let vx = w.x - e.x
                      let vy = w.y - e.y
                      return CGPoint(
                          x: max(0.02, min(0.98, w.x + vx * 0.28)),
                          y: max(0.02, min(0.98, w.y + vy * 0.28))
                      )
                  }
                  return w
              }

              var rightPalmCenter: CGPoint? {
                  guard let w = rightWrist else { return nil }
                  if let e = rightElbow {
                      let vx = w.x - e.x
                      let vy = w.y - e.y
                      return CGPoint(
                          x: max(0.02, min(0.98, w.x + vx * 0.28)),
                          y: max(0.02, min(0.98, w.y + vy * 0.28))
                      )
                  }
                  return w
              }
          }

          final class VisionPoseService: NSObject, ObservableObject, AVCaptureVideoDataOutputSampleBufferDelegate {
              @Published var joints = DetectedBodyJoints()
              @Published var leftHandTrail: [CGPoint] = []
              @Published var rightHandTrail: [CGPoint] = []
              @Published var isCameraAuthorized: Bool = false
              @Published var cameraErrorMessage: String? = nil

              let captureSession = AVCaptureSession()
              private let sessionQueue = DispatchQueue(label: "com.hoopflash.camera.sessionQueue", qos: .userInitiated)
              private let visionQueue = DispatchQueue(label: "com.hoopflash.camera.visionQueue", qos: .userInteractive)

              // Single reusable Vision request & thread-safe frame gate to prevent ANE/Vision buffer exhaustion crash
              private let poseRequest = VNDetectHumanBodyPoseRequest()
              private let frameGateLock = NSLock()
              private var isProcessingFrame: Bool = false
              private var lastProcessedTimestamp: CFTimeInterval = 0
              private var isConfigured: Bool = false
              private var smoothedJoints = DetectedBodyJoints()

              func requestPermissionAndStart() {
                  let status = AVCaptureDevice.authorizationStatus(for: .video)
                  switch status {
                  case .authorized:
                      DispatchQueue.main.async {
                          self.isCameraAuthorized = true
                          self.cameraErrorMessage = nil
                      }
                      startSession()
                  case .notDetermined:
                      AVCaptureDevice.requestAccess(for: .video) { [weak self] granted in
                          guard let self = self else { return }
                          DispatchQueue.main.async {
                              self.isCameraAuthorized = granted
                              if !granted {
                                  self.cameraErrorMessage = "未开启相机权限：已自动启用【触屏点按靶标】兼容模式"
                              }
                          }
                          if granted {
                              self.startSession()
                          }
                      }
                  default:
                      DispatchQueue.main.async {
                          self.isCameraAuthorized = false
                          self.cameraErrorMessage = "相机权限未开启：当前支持直接点击屏幕靶标训练"
                      }
                  }
              }

              func startSession() {
                  sessionQueue.async { [weak self] in
                      guard let self = self else { return }
                      if !self.isConfigured {
                          self.configureSessionLocked()
                      }
                      if self.isConfigured && !self.captureSession.isRunning {
                          self.captureSession.startRunning()
                      }
                  }
              }

              func stopSession() {
                  sessionQueue.async { [weak self] in
                      guard let self = self else { return }
                      if self.captureSession.isRunning {
                          self.captureSession.stopRunning()
                      }
                  }
              }

              private func configureSessionLocked() {
                  captureSession.beginConfiguration()
                  if captureSession.canSetSessionPreset(.hd1280x720) {
                      captureSession.sessionPreset = .hd1280x720
                  } else {
                      captureSession.sessionPreset = .vga640x480
                  }

                  guard let device = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .front),
                        let input = try? AVCaptureDeviceInput(device: device),
                        captureSession.canAddInput(input) else {
                      captureSession.commitConfiguration()
                      DispatchQueue.main.async {
                          self.cameraErrorMessage = "未检测到前置相机，已启用触屏交互模式"
                      }
                      return
                  }
                  captureSession.addInput(input)

                  let output = AVCaptureVideoDataOutput()
                  output.alwaysDiscardsLateVideoFrames = true
                  output.videoSettings = [
                      kCVPixelBufferPixelFormatTypeKey as String: Int(kCVPixelFormatType_420YpCbCr8BiPlanarFullRange)
                  ]
                  output.setSampleBufferDelegate(self, queue: visionQueue)

                  if captureSession.canAddOutput(output) {
                      captureSession.addOutput(output)
                      if let conn = output.connection(with: .video) {
                          if conn.isVideoOrientationSupported {
                              conn.videoOrientation = .portrait
                          }
                          if conn.isVideoMirroringSupported {
                              conn.isVideoMirrored = true
                          }
                      }
                      isConfigured = true
                  }
                  captureSession.commitConfiguration()
              }

              func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
                  let now = CACurrentMediaTime()
                  frameGateLock.lock()
                  // Cap Vision pose inference to ~25 FPS and strictly drop overlapping frames
                  if isProcessingFrame || (now - lastProcessedTimestamp < 0.038) {
                      frameGateLock.unlock()
                      return
                  }
                  isProcessingFrame = true
                  lastProcessedTimestamp = now
                  frameGateLock.unlock()

                  defer {
                      frameGateLock.lock()
                      isProcessingFrame = false
                      frameGateLock.unlock()
                  }

                  guard let pixelBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }

                  let handler = VNImageRequestHandler(cvPixelBuffer: pixelBuffer, orientation: .up, options: [:])
                  do {
                      try handler.perform([poseRequest])
                      guard let observation = poseRequest.results?.first else { return }
                      let raw = extractJoints(from: observation)
                      let smoothed = blendJoints(previous: smoothedJoints, current: raw, alpha: 0.62)
                      smoothedJoints = smoothed

                      DispatchQueue.main.async { [weak self] in
                          guard let self = self else { return }
                          self.joints = smoothed
                          if let lp = smoothed.leftPalmCenter {
                              self.leftHandTrail.append(lp)
                              if self.leftHandTrail.count > 8 { self.leftHandTrail.removeFirst() }
                          }
                          if let rp = smoothed.rightPalmCenter {
                              self.rightHandTrail.append(rp)
                              if self.rightHandTrail.count > 8 { self.rightHandTrail.removeFirst() }
                          }
                      }
                  } catch {
                      // Safely ignore transient Vision frame error
                  }
              }

              private func extractJoints(from obs: VNHumanBodyPoseObservation) -> DetectedBodyJoints {
                  var res = DetectedBodyJoints()
                  guard let pts = try? obs.recognizedPoints(.all) else { return res }

                  func pt(_ key: VNHumanBodyPoseObservation.JointName, minConf: Float = 0.22) -> CGPoint? {
                      guard let p = pts[key], p.confidence >= minConf,
                            !p.location.x.isNaN, !p.location.y.isNaN else { return nil }
                      return CGPoint(x: CGFloat(p.location.x), y: CGFloat(1.0 - p.location.y))
                  }

                  res.leftWrist = pt(.leftWrist)
                  res.rightWrist = pt(.rightWrist)
                  res.leftElbow = pt(.leftElbow)
                  res.rightElbow = pt(.rightElbow)
                  res.nose = pt(.nose)
                  res.leftShoulder = pt(.leftShoulder)
                  res.rightShoulder = pt(.rightShoulder)
                  res.rootHip = pt(.root)
                  res.leftKnee = pt(.leftKnee)
                  res.rightKnee = pt(.rightKnee)
                  res.leftAnkle = pt(.leftAnkle)
                  res.rightAnkle = pt(.rightAnkle)
                  return res
              }

              private func blendPoint(_ oldPt: CGPoint?, _ newPt: CGPoint?, alpha: CGFloat) -> CGPoint? {
                  guard let n = newPt else { return nil }
                  guard let o = oldPt else { return n }
                  return CGPoint(
                      x: o.x * (1.0 - alpha) + n.x * alpha,
                      y: o.y * (1.0 - alpha) + n.y * alpha
                  )
              }

              private func blendJoints(previous: DetectedBodyJoints, current: DetectedBodyJoints, alpha: CGFloat) -> DetectedBodyJoints {
                  var out = DetectedBodyJoints()
                  out.leftWrist = blendPoint(previous.leftWrist, current.leftWrist, alpha: alpha)
                  out.rightWrist = blendPoint(previous.rightWrist, current.rightWrist, alpha: alpha)
                  out.leftElbow = blendPoint(previous.leftElbow, current.leftElbow, alpha: alpha)
                  out.rightElbow = blendPoint(previous.rightElbow, current.rightElbow, alpha: alpha)
                  out.nose = blendPoint(previous.nose, current.nose, alpha: alpha)
                  out.leftShoulder = blendPoint(previous.leftShoulder, current.leftShoulder, alpha: alpha)
                  out.rightShoulder = blendPoint(previous.rightShoulder, current.rightShoulder, alpha: alpha)
                  out.rootHip = blendPoint(previous.rootHip, current.rootHip, alpha: alpha)
                  out.leftKnee = blendPoint(previous.leftKnee, current.leftKnee, alpha: alpha)
                  out.rightKnee = blendPoint(previous.rightKnee, current.rightKnee, alpha: alpha)
                  out.leftAnkle = blendPoint(previous.leftAnkle, current.leftAnkle, alpha: alpha)
                  out.rightAnkle = blendPoint(previous.rightAnkle, current.rightAnkle, alpha: alpha)
                  return out
              }
          }

