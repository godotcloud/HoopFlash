              }

              private func finishWorkout() {
                  guard !isFinished else { return }
                  isFinished = true
                  visionService.stopSession()

                  let hitSamples = samples.filter { $0.wasHit }
                  let allMs = hitSamples.map { $0.reactionMs }
                  let leftMs = hitSamples.filter { $0.isLeftHandOrSide }.map { $0.reactionMs }
                  let rightMs = hitSamples.filter { !$0.isLeftHandOrSide }.map { $0.reactionMs }

                  let avgMs = allMs.isEmpty ? 0 : (allMs.reduce(0, +) / allMs.count)
                  let bestMs = allMs.min() ?? 0
                  let lAvg = leftMs.isEmpty ? avgMs : (leftMs.reduce(0, +) / leftMs.count)
                  let rAvg = rightMs.isEmpty ? avgMs : (rightMs.reduce(0, +) / rightMs.count)

                  let record = TrainingRecord(
                      id: UUID(),
                      date: Date(),
                      mode: mode,
                      difficulty: difficulty,
                      score: score,
                      hits: hits,
                      misses: misses,
                      avgReactionMs: avgMs,
                      bestReactionMs: bestMs,
                      leftAvgMs: lAvg,
                      rightAvgMs: rAvg,
                      maxCombo: maxCombo,
                      durationSeconds: 45,
                      samples: samples
                  )
                  store.addRecord(record)
                  onFinish(record)
              }

              // MARK: - HomeCourt AR Canvas Rendering
              private func drawHomeCourtPerspectiveFloor(context: GraphicsContext, size: CGSize) {
                  var floorGrid = Path()
                  let topY = size.height * 0.68
                  let bottomY = size.height * 0.92
                  // Trapezoid perspective paint zone
                  floorGrid.move(to: CGPoint(x: size.width * 0.24, y: topY))
                  floorGrid.addLine(to: CGPoint(x: size.width * 0.76, y: topY))
                  floorGrid.addLine(to: CGPoint(x: size.width * 0.94, y: bottomY))
                  floorGrid.addLine(to: CGPoint(x: size.width * 0.06, y: bottomY))
                  floorGrid.closeSubpath()

                  context.fill(floorGrid, with: .color(Color.cyan.opacity(0.08)))
                  context.stroke(floorGrid, with: .color(Color.cyan.opacity(0.35)), lineWidth: 2)
              }

              private func drawHandCometTrails(context: GraphicsContext, size: CGSize) {
                  func drawTrail(_ pts: [CGPoint], color: Color) {
                      guard pts.count >= 2 else { return }
                      for i in 1..<pts.count {
                          let p1 = CGPoint(x: pts[i - 1].x * size.width, y: pts[i - 1].y * size.height)
                          let p2 = CGPoint(x: pts[i].x * size.width, y: pts[i].y * size.height)
                          let ratio = Double(i) / Double(pts.count)
                          var seg = Path()
                          seg.move(to: p1)
                          seg.addLine(to: p2)
                          context.stroke(seg, with: .color(color.opacity(ratio * 0.75)), style: StrokeStyle(lineWidth: CGFloat(ratio * 14), lineCap: .round))
                      }
                  }
                  drawTrail(visionService.leftHandTrail, color: .orange)
                  drawTrail(visionService.rightHandTrail, color: .cyan)
              }

              private func drawNeonBodySkeleton(context: GraphicsContext, size: CGSize) {
                  let j = visionService.joints
                  func scr(_ pt: CGPoint?) -> CGPoint? {
                      guard let p = pt else { return nil }
                      return CGPoint(x: p.x * size.width, y: p.y * size.height)
                  }

                  let bones: [(CGPoint?, CGPoint?)] = [
                      (j.leftShoulder, j.rightShoulder),
                      (j.leftShoulder, j.leftElbow),
                      (j.leftElbow, j.leftWrist),
                      (j.rightShoulder, j.rightElbow),
                      (j.rightElbow, j.rightWrist),
                      (j.leftShoulder, j.rootHip),
                      (j.rightShoulder, j.rootHip),
                      (j.rootHip, j.leftKnee),
                      (j.rootHip, j.rightKnee),
                      (j.leftKnee, j.leftAnkle),
                      (j.rightKnee, j.rightAnkle)
                  ]

                  for (a, b) in bones {
                      if let p1 = scr(a), let p2 = scr(b) {
                          var path = Path()
                          path.move(to: p1)
                          path.addLine(to: p2)
                          context.stroke(path, with: .color(Color.cyan.opacity(0.85)), style: StrokeStyle(lineWidth: 4.5, lineCap: .round))
                      }
                  }

                  // Draw Glowing Palm Strike Reticles
                  for (palm, color) in [(j.leftPalmCenter, Color.orange), (j.rightPalmCenter, Color.cyan)] {
                      if let p = scr(palm) {
                          let outer = CGRect(x: p.x - 24, y: p.y - 24, width: 48, height: 48)
                          let inner = CGRect(x: p.x - 10, y: p.y - 10, width: 20, height: 20)
                          context.fill(Path(ellipseIn: outer), with: .color(color.opacity(0.32)))
                          context.stroke(Path(ellipseIn: outer), with: .color(.white), lineWidth: 2.5)
                          context.fill(Path(ellipseIn: inner), with: .color(color))
                      }
                  }
              }
          }
