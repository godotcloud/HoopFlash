          import SwiftUI

          struct DribbleRhythmView: View {
              let difficulty: DifficultyTier
              @ObservedObject var store: TrainingStore
              let onFinish: (TrainingRecord) -> Void
              let onCancel: () -> Void

              @State private var remainingSeconds: Int = 45
              @State private var currentBPM: Int = 110
              @State private var beatCount: Int = 0
              @State private var leftFootActive: Bool = true
              @State private var headUpNumber: Int = 3
              @State private var options: [Int] = [1, 3, 5]
              @State private var currentMoveCall: String = "原地高频碎步 + 低手运球"
              @State private var score: Int = 0
              @State private var hits: Int = 0
              @State private var misses: Int = 0
              @State private var combo: Int = 0
              @State private var maxCombo: Int = 0
              @State private var promptSpawnedAt: Date = Date()
              @State private var samples: [SplitReactionSample] = []
              @State private var isFinished: Bool = false

              private let moveLibrary = [
                  "原地高频碎步 (Quick Feet)！脚尖点地！",
                  "体前大幅度变向 (Crossover)！压低重心！",
                  "左手单手重砸球 (Pound)！抬头看屏幕！",
                  "右手极速内外运球 (In & Out)！保持节奏！",
                  "胯下连续交叉换手！绝对不要低头看球！"
              ]

              private let secondTimer = Timer.publish(every: 1.0, on: .main, in: .common).autoconnect()
              @State private var beatTimer: Timer? = nil

              var body: some View {
                  VStack(spacing: 14) {
                      HStack {
                          Button {
                              isFinished = true
                              stopBeatTimer()
                              SoundAndSpeechService.shared.stopSpeech()
                              onCancel()
                          } label: {
                              Image(systemName: "xmark")
                                  .font(.system(size: 16, weight: .black))
                                  .foregroundColor(.white)
                                  .frame(width: 38, height: 38)
                                  .background(Color.white.opacity(0.14))
                                  .clipShape(Circle())
                          }
                          Spacer()
                          Text("高频碎步运球节拍 & 抬头视野")
                              .font(.system(size: 16, weight: .black))
                              .foregroundColor(.white)
                          Spacer()
                          Text("\(remainingSeconds)s")
                              .font(.system(size: 20, weight: .black, design: .rounded))
                              .foregroundColor(.purple)
                      }
                      .padding(.horizontal, 16)
                      .padding(.top, 8)

                      VStack(spacing: 6) {
                          HStack {
                              Label("\(currentBPM) BPM 步频", systemImage: "metronome.fill")
                                  .font(.system(size: 15, weight: .black, design: .rounded))
                                  .foregroundColor(.cyan)
                              Spacer()
                              Text("连击 x\(combo)  •  得分 \(score)")
                                  .font(.system(size: 14, weight: .bold))
                                  .foregroundColor(.orange)
                          }
                          Text(currentMoveCall)
                              .font(.system(size: 16, weight: .heavy))
                              .foregroundColor(.yellow)
                              .frame(maxWidth: .infinity, alignment: .leading)
                      }
                      .padding(14)
                      .background(Color.white.opacity(0.07))
                      .clipShape(RoundedRectangle(cornerRadius: 16))
                      .padding(.horizontal, 16)

                      HStack(spacing: 20) {
                          footIndicator(title: "左脚踏步 (L)", isActive: leftFootActive)
                          footIndicator(title: "右脚踏步 (R)", isActive: !leftFootActive)
                      }
                      .padding(.horizontal, 16)

                      VStack(spacing: 12) {
                          Text("抬头视野训练：看清教练手势数字并点击对应答案")
                              .font(.system(size: 12, weight: .semibold))
                              .foregroundColor(.white.opacity(0.75))

                          ZStack {
                              Circle()
                                  .fill(
                                      RadialGradient(
                                          colors: [Color.purple, Color.purple.opacity(0.2)],
                                          center: .center,
                                          startRadius: 10,
                                          endRadius: 76
                                      )
                                  )
                                  .frame(width: 136, height: 136)
                                  .overlay(Circle().stroke(Color.white, lineWidth: 3))

                              VStack(spacing: 2) {
                                  Text("\(headUpNumber)")
                                      .font(.system(size: 62, weight: .black, design: .rounded))
                                      .foregroundColor(.white)
                                  Text("手势比数")
                                      .font(.system(size: 11, weight: .bold))
                                      .foregroundColor(.white.opacity(0.8))
                              }
                          }

                          HStack(spacing: 14) {
                              ForEach(options, id: \.self) { num in
                                  Button {
                                      verifyNumberTap(num)
                                  } label: {
                                      Text("\(num)")
                                          .font(.system(size: 26, weight: .black, design: .rounded))
                                          .foregroundColor(.white)
                                          .frame(maxWidth: .infinity)
                                          .frame(height: 58)
                                          .background(Color.white.opacity(0.14))
                                          .clipShape(RoundedRectangle(cornerRadius: 14))
                                          .overlay(
                                              RoundedRectangle(cornerRadius: 14)
                                                  .stroke(Color.cyan.opacity(0.6), lineWidth: 2)
                                          )
                                  }
                              }
                          }
                      }
                      .padding(16)
                      .background(Color.white.opacity(0.06))
                      .clipShape(RoundedRectangle(cornerRadius: 20))
                      .padding(.horizontal, 16)

                      Spacer()
                  }
                  .background(Color(red: 0.06, green: 0.05, blue: 0.14).ignoresSafeArea())
                  .onAppear {
                      currentBPM = difficulty.baseBPM
                      generateNewHeadUpPrompt()
                      restartBeatTimer()
                  }
                  .onDisappear {
                      stopBeatTimer()
                  }
                  .onReceive(secondTimer) { _ in
                      guard !isFinished else { return }
                      if remainingSeconds > 0 {
                          remainingSeconds -= 1
                          if remainingSeconds % 9 == 0 {
                              currentBPM = min(210, currentBPM + 8)
                              restartBeatTimer()
                              if let nextMove = moveLibrary.randomElement() {
                                  currentMoveCall = nextMove
                                  if store.voiceCoachEnabled {
                                      SoundAndSpeechService.shared.speakCoach(nextMove, rate: 0.56)
                                  }
                              }
                          }
                      } else {
                          finishSession()
                      }
                  }
              }

              private func footIndicator(title: String, isActive: Bool) -> some View {
                  VStack(spacing: 4) {
                      Image(systemName: "shoeprints.fill")
                          .font(.system(size: 28))
                          .foregroundColor(isActive ? .black : .white.opacity(0.35))
                      Text(title)
                          .font(.system(size: 12, weight: .heavy))
                          .foregroundColor(isActive ? .black : .white.opacity(0.45))
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 12)
                  .background(isActive ? Color.cyan : Color.white.opacity(0.06))
                  .clipShape(RoundedRectangle(cornerRadius: 14))
              }

              private func restartBeatTimer() {
                  stopBeatTimer()
                  let interval = 60.0 / Double(max(60, currentBPM))
                  beatTimer = Timer.scheduledTimer(withTimeInterval: interval, repeats: true) { _ in
                      DispatchQueue.main.async {
                          beatCount += 1
                          leftFootActive.toggle()
                          if store.soundEffectsEnabled {
                              SoundAndSpeechService.shared.playMetronomeTick(isAccent: beatCount % 4 == 0)
                          }
                      }
                  }
              }

              private func stopBeatTimer() {
                  beatTimer?.invalidate()
                  beatTimer = nil
              }

              private func generateNewHeadUpPrompt() {
                  let target = Int.random(in: 1...5)
                  headUpNumber = target
                  var set = Set<Int>([target])
                  while set.count < 3 {
                      set.insert(Int.random(in: 1...5))
                  }
                  options = Array(set).shuffled()
                  promptSpawnedAt = Date()
              }

              private func verifyNumberTap(_ selected: Int) {
                  let elapsedMs = max(130, Int(Date().timeIntervalSince(promptSpawnedAt) * 1000.0))
                  if selected == headUpNumber {
                      hits += 1
                      combo += 1
                      maxCombo = max(maxCombo, combo)
                      samples.append(SplitReactionSample(index: samples.count + 1, reactionMs: elapsedMs, isLeftHandOrSide: leftFootActive, wasHit: true))
                      score += 120 + (combo * 15)
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playHitSound(combo: combo)
                      }
                  } else {
                      misses += 1
                      combo = 0
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                  }
                  generateNewHeadUpPrompt()
              }

              private func finishSession() {
                  isFinished = true
                  stopBeatTimer()
                  let hitList = samples.filter { $0.wasHit }.map { $0.reactionMs }
                  let avgMs = hitList.isEmpty ? 420 : (hitList.reduce(0, +) / hitList.count)
                  let bestMs = hitList.min() ?? 350
                  let record = TrainingRecord(
                      id: UUID(),
                      date: Date(),
                      mode: .dribbleRhythm,
                      difficulty: difficulty,
                      score: score + (beatCount * 5),
                      hits: max(1, hits),
                      misses: misses,
                      avgReactionMs: avgMs,
                      bestReactionMs: bestMs,
                      leftAvgMs: avgMs,
                      rightAvgMs: avgMs,
                      maxCombo: maxCombo,
                      durationSeconds: 45,
                      samples: samples
                  )
                  store.addRecord(record)
                  onFinish(record)
              }
          }
