                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                      coachInstruction = "误触红灯陷阱！(-90)"
                      spawnNextPod()
                      return
                  }

                  pod.tapsRemaining -= 1
                  if pod.tapsRemaining > 0 {
                      activePod = pod
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playHitSound(combo: combo)
                      }
                      return
                  }

                  let reactionMs = max(110, Int(Date().timeIntervalSince(pod.spawnedAt) * 1000.0))
                  samples.append(SplitReactionSample(index: samples.count + 1, reactionMs: reactionMs, isLeftHandOrSide: index % 3 == 0, wasHit: true))
                  hits += 1
                  combo += 1
                  maxCombo = max(maxCombo, combo)
                  let points = 110 + max(0, Int((difficulty.targetTimeoutMs - Double(reactionMs)) / 10.0)) + (combo * 12)
                  score += points
                  if store.soundEffectsEnabled {
                      SoundAndSpeechService.shared.playHitSound(combo: combo)
                  }
                  coachInstruction = "漂亮！\(courtZones[index]) 反应 \(reactionMs)ms (+\(points))"
                  spawnNextPod()
              }

              private func spawnNextPod() {
                  let nextIdx = Int.random(in: 0..<9)
                  let roll = Double.random(in: 0...1)
                  let type: PodSignalType
                  let prompt: String
                  let taps: Int

                  if roll < difficulty.fakeBombProbability {
                      type = .chargeFakeRed
                      prompt = "勿碰陷阱"
                      taps = 1
                      coachInstruction = "红灯陷阱！【\(courtZones[nextIdx])】切勿拍击！"
                  } else if roll < difficulty.fakeBombProbability + 0.28 {
                      type = .crossoverOrange
                      prompt = "双击变向x2"
                      taps = 2
                      coachInstruction = "橙色双变向！快速连点【\(courtZones[nextIdx])】2次！"
                      if store.voiceCoachEnabled {
                          SoundAndSpeechService.shared.speakCoach("双击\(courtZones[nextIdx])", rate: 0.60)
                      }
                  } else {
                      type = .driveGreen
                      prompt = "极速单点"
                      taps = 1
                      coachInstruction = "绿灯突破！立即点击【\(courtZones[nextIdx])】！"
                      if store.voiceCoachEnabled {
                          SoundAndSpeechService.shared.speakCoach(courtZones[nextIdx], rate: 0.60)
                      }
                  }

                  activePod = ActivePodState(index: nextIdx, type: type, promptText: prompt, spawnedAt: Date(), tapsRemaining: taps)
              }

              private func completeSession() {
                  isFinished = true
                  let hitList = samples.filter { $0.wasHit }.map { $0.reactionMs }
                  let avgMs = hitList.isEmpty ? 0 : (hitList.reduce(0, +) / hitList.count)
                  let bestMs = hitList.min() ?? 0
                  let record = TrainingRecord(
                      id: UUID(),
                      date: Date(),
                      mode: .courtPodReflex,
                      difficulty: difficulty,
                      score: score,
                      hits: hits,
                      misses: misses,
                      avgReactionMs: avgMs,
                      bestReactionMs: bestMs,
                      leftAvgMs: avgMs,
                      rightAvgMs: avgMs,
                      maxCombo: maxCombo,
                      durationSeconds: 45,
                      samples: samples
                  )
                  store.addRecord(record)
                  onFinish(record)
              }

              private func statPill(label: String, value: String, color: Color) -> some View {
                  VStack(spacing: 2) {
                      Text(label)
                          .font(.system(size: 10, weight: .bold))
                          .foregroundColor(.white.opacity(0.6))
                      Text(value)
                          .font(.system(size: 18, weight: .black, design: .rounded))
                          .foregroundColor(color)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 8)
                  .background(Color.white.opacity(0.06))
                  .clipShape(RoundedRectangle(cornerRadius: 12))
              }

              private func legendDot(color: Color, text: String) -> some View {
                  HStack(spacing: 4) {
                      Circle().fill(color).frame(width: 8, height: 8)
                      Text(text)
                  }
              }
          }
