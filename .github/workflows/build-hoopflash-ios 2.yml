              private var analyticsScroll: some View {
                  ScrollView(showsIndicators: false) {
                      VStack(alignment: .leading, spacing: 18) {
                          Text("荣誉勋章馆 (HomeCourt Achievements)")
                              .font(.system(size: 16, weight: .black))
                              .foregroundColor(.white)

                          ForEach(store.badges) { badge in
                              HStack(spacing: 12) {
                                  Image(systemName: badge.icon)
                                      .font(.system(size: 26))
                                      .foregroundColor(badge.isUnlocked ? badge.accent : .gray)
                                      .frame(width: 40)

                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(badge.title)
                                          .font(.system(size: 15, weight: .bold))
                                          .foregroundColor(badge.isUnlocked ? .white : .white.opacity(0.5))
                                      Text(badge.description)
                                          .font(.system(size: 12))
                                          .foregroundColor(.white.opacity(0.65))
                                  }
                                  Spacer()
                                  Text(badge.isUnlocked ? "已点亮" : "待解锁")
                                      .font(.system(size: 11, weight: .heavy))
                                      .fixedSize(horizontal: true, vertical: false)
                                      .foregroundColor(badge.isUnlocked ? .black : .white.opacity(0.45))
                                      .padding(.horizontal, 10)
                                      .padding(.vertical, 5)
                                      .background(badge.isUnlocked ? badge.accent : Color.white.opacity(0.08))
                                      .clipShape(Capsule())
                              }
                              .padding(14)
                              .background(Color.white.opacity(0.06))
                              .clipShape(RoundedRectangle(cornerRadius: 16))
                          }

                          HStack {
                              Text("历史特训战报 (点击查看分项曲线)")
                                  .font(.system(size: 16, weight: .black))
                                  .foregroundColor(.white)
                              Spacer()
                              if !store.records.isEmpty {
                                  Button("清空记录") {
                                      store.clearRecords()
                                  }
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.red)
                              }
                          }

                          if store.records.isEmpty {
                              Text("尚无训练数据，快去【特训中心】体验 HomeCourt 级 AR 视觉控球挑战吧！")
                                  .font(.system(size: 13))
                                  .foregroundColor(.white.opacity(0.65))
                                  .padding(20)
                                  .frame(maxWidth: .infinity)
                                  .background(Color.white.opacity(0.05))
                                  .clipShape(RoundedRectangle(cornerRadius: 16))
                          } else {
                              ForEach(store.records) { rec in
                                  Button {
                                      latestFinishedRecord = rec
                                  } label: {
                                      VStack(alignment: .leading, spacing: 6) {
                                          HStack {
                                              Text(rec.mode.rawValue)
                                                  .font(.system(size: 15, weight: .bold))
                                                  .foregroundColor(.white)
                                              Spacer()
                                              Text(rec.agilityRating)
                                                  .font(.system(size: 12, weight: .heavy))
                                                  .foregroundColor(.orange)
                                          }
                                          HStack(spacing: 12) {
                                              Text("得分 \(rec.score)")
                                              Text("命中 \(rec.hits)次 (\(rec.accuracyPercent)%)")
                                              if rec.avgReactionMs > 0 {
                                                  Text("均值 \(rec.avgReactionMs)ms")
                                              }
                                              Text("左/右 \(rec.leftAvgMs)/\(rec.rightAvgMs)ms")
                                          }
                                          .font(.system(size: 11, weight: .medium))
                                          .foregroundColor(.white.opacity(0.72))
                                      }
                                      .padding(14)
                                      .background(Color.white.opacity(0.06))
                                      .clipShape(RoundedRectangle(cornerRadius: 14))
                                  }
                              }
                          }
                      }
                      .padding(16)
                  }
              }

              // MARK: - Custom Bottom Tab Bar
              private var customBottomTabBar: some View {
                  HStack(spacing: 0) {
                      tabBarButton(index: 0, title: "AR 特训中心", icon: "figure.basketball")
                      tabBarButton(index: 1, title: "球探成长档案", icon: "chart.xyaxis.line")
                  }
                  .padding(.top, 8)
                  .padding(.bottom, 6)
                  .background(Color(red: 0.05, green: 0.08, blue: 0.14))
                  .overlay(
                      Rectangle()
                          .fill(Color.white.opacity(0.08))
                          .frame(height: 1),
                      alignment: .top
                  )
              }

              private func tabBarButton(index: Int, title: String, icon: String) -> some View {
                  let isSelected = (selectedTab == index)
                  return Button {
                      selectedTab = index
                  } label: {
                      VStack(spacing: 4) {
                          Image(systemName: icon)
                              .font(.system(size: 20, weight: .bold))
                          Text(title)
                              .font(.system(size: 11, weight: .bold))
                      }
                      .foregroundColor(isSelected ? .orange : .white.opacity(0.5))
                      .frame(maxWidth: .infinity)
                  }
              }
          }

          // MARK: - HomeCourt-Style Post-Workout Telemetry Sheet
          struct WorkoutResultSheet: View {
              let record: TrainingRecord
              let onDismiss: () -> Void

              var body: some View {
                  ScrollView {
                      VStack(spacing: 18) {
                          HStack {
                              Text("HOMECOURT AI 球探分析报告")
                                  .font(.system(size: 13, weight: .heavy))
                                  .foregroundColor(.cyan)
                              Spacer()
                              Text(record.difficulty.rawValue)
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.orange)
                          }
                          .padding(.top, 20)

                          VStack(spacing: 6) {
                              Text(record.agilityRating)
                                  .font(.system(size: 32, weight: .black, design: .rounded))
                                  .foregroundColor(.yellow)
                              Text(record.mode.rawValue)
                                  .font(.system(size: 15, weight: .bold))
                                  .foregroundColor(.white.opacity(0.85))
                          }

                          // Core Metrics Grid
                          LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 12) {
                              telemetryTile(title: "综合特训得分", value: "\(record.score)", unit: "PTS", color: .green)
                              telemetryTile(title: "平均神经反射", value: "\(record.avgReactionMs)", unit: "ms", color: .cyan)
                              telemetryTile(title: "最快单次爆发", value: "\(record.bestReactionMs)", unit: "ms", color: .yellow)
                              telemetryTile(title: "最高连续命中", value: "x\(record.maxCombo)", unit: "准确率 \(record.accuracyPercent)%", color: .orange)
                          }

                          // Left vs Right Hand/Foot Symmetry Bar
                          VStack(alignment: .leading, spacing: 8) {
                              Text("左右侧反应均衡度对比 (Left vs Right Split)")
                                  .font(.system(size: 13, weight: .bold))
                                  .foregroundColor(.white)

                              HStack {
                                  VStack(alignment: .leading) {
                                      Text("左侧/左手均值")
                                          .font(.system(size: 11))
                                          .foregroundColor(.white.opacity(0.65))
                                      Text("\(record.leftAvgMs) ms")
                                          .font(.system(size: 16, weight: .black, design: .rounded))
                                          .foregroundColor(.orange)
                                  }
                                  Spacer()
                                  VStack(alignment: .trailing) {
                                      Text("右侧/右手均值")
                                          .font(.system(size: 11))
                                          .foregroundColor(.white.opacity(0.65))
                                      Text("\(record.rightAvgMs) ms")
                                          .font(.system(size: 16, weight: .black, design: .rounded))
                                          .foregroundColor(.cyan)
                                  }
                              }
                          }
                          .padding(14)
                          .background(Color.white.opacity(0.06))
                          .clipShape(RoundedRectangle(cornerRadius: 16))

                          // Split Reaction Curve Bar Chart
                          if !record.samples.isEmpty {
                              VStack(alignment: .leading, spacing: 10) {
                                  Text("单次触靶反应耗时分布 (越低越快)")
                                      .font(.system(size: 13, weight: .bold))
                                      .foregroundColor(.white)

                                  HStack(alignment: .bottom, spacing: 6) {
                                      ForEach(Array(record.samples.prefix(18))) { sample in
                                          let normHeight = max(16.0, min(90.0, (1200.0 - Double(min(1100, sample.reactionMs))) / 11.0))
                                          VStack(spacing: 4) {
                                              RoundedRectangle(cornerRadius: 4)
                                                  .fill(sample.wasHit ? (sample.isLeftHandOrSide ? Color.orange : Color.cyan) : Color.red)
                                                  .frame(height: CGFloat(normHeight))
                                              Text("#\(sample.index)")
                                                  .font(.system(size: 8, weight: .bold))
                                                  .foregroundColor(.white.opacity(0.5))
                                          }
                                          .frame(maxWidth: .infinity)
                                      }
                                  }
                                  .frame(height: 110)
                              }
                              .padding(14)
                              .background(Color.white.opacity(0.06))
                              .clipShape(RoundedRectangle(cornerRadius: 16))
                          }

                          Button(action: onDismiss) {
                              Text("保存球探报告 • 继续突破")
                                  .font(.system(size: 16, weight: .black))
                                  .foregroundColor(.black)
                                  .frame(maxWidth: .infinity)
                                  .frame(height: 52)
                                  .background(Color.orange)
                                  .clipShape(RoundedRectangle(cornerRadius: 16))
                          }
                          .padding(.top, 6)
                      }
                      .padding(20)
                  }
                  .background(Color(red: 0.05, green: 0.08, blue: 0.14).ignoresSafeArea())
              }

              private func telemetryTile(title: String, value: String, unit: String, color: Color) -> some View {
                  VStack(alignment: .leading, spacing: 4) {
                      Text(title)
                          .font(.system(size: 11, weight: .semibold))
                          .foregroundColor(.white.opacity(0.65))
                      HStack(alignment: .firstTextBaseline, spacing: 4) {
                          Text(value)
                              .font(.system(size: 24, weight: .black, design: .rounded))
                              .foregroundColor(color)
                          Text(unit)
                              .font(.system(size: 11, weight: .bold))
                              .foregroundColor(.white.opacity(0.75))
                      }
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .padding(14)
                  .background(Color.white.opacity(0.07))
                  .clipShape(RoundedRectangle(cornerRadius: 16))
              }
          }
          EOF

          # 10. Generate App Entry Point
          cat << 'EOF' > HoopFlashPro/Sources/HoopFlashProApp.swift
          import SwiftUI

          @main
          struct HoopFlashProApp: App {
              init() {
                  UIApplication.shared.isIdleTimerDisabled = true
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          EOF

          # 11. Generate project.yml for XcodeGen
          cat << 'EOF' > project.yml
          name: HoopFlashPro
          options:
            bundleIdPrefix: com.hoopflash.trainer
            deploymentTarget:
              iOS: "15.0"
          targets:
            HoopFlashPro:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: HoopFlashPro/Sources
              resources:
                - path: HoopFlashPro/Resources/Assets.xcassets
              info:
                path: HoopFlashPro/Resources/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hoopflash.trainer.app
                  INFOPLIST_FILE: HoopFlashPro/Resources/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  ENABLE_BITCODE: "NO"
                  ENABLE_PREVIEWS: "NO"
          EOF

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Compile iOS Release Archive (Unsigned)
        run: |
          xcodebuild clean build \
            -project HoopFlashPro.xcodeproj \
            -scheme HoopFlashPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned .ipa Bundle
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/HoopFlashPro.app build/Payload/
          cd build
          zip -r9 HoopFlashPro-Unsigned.ipa Payload
          ls -lh HoopFlashPro-Unsigned.ipa

      - name: Upload Direct Uncompressed IPA to GitHub Releases (No Outer Zip)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "HoopFlash Pro 2.0 (HomeCourt AR 级重构版 • 免解压直装 .ipa)"
          body: |
            ### 🏀 HoopFlash Pro 2.0 — 深度对标 HomeCourt 的 AR 篮球敏捷与反应训练系统
            - **免解压直链下载**：点击下方 Assets 中的 `HoopFlashPro-Unsigned.ipa` 即可直接下载安装。
            - **本次核心升级**：
              1. **根治 AI 视觉摸锥模式闪退**：重写 `AVAudioEngine` 硬件声道格式自适应与 `VNDetectHumanBodyPoseRequest` 25FPS 单帧节流锁（防止 Vision 线程并发爆内存与音频采样率断言崩溃）。
              2. **解决全屏黑边与排版挤压**：补齐原生 `UILaunchScreen` 全屏配置，移除遮挡顶部的系统半透明导航栏，重构胶囊式功能开关、无截断难度分段按钮与全宽操作栏。
              3. **深度引入 HomeCourt AR 核心玩法**：新增【AR 退后入框身体校准 + 举手凌空触碰绿圈无接触开局】、【手肘到手腕向量外推手掌中心 + 彗星轨迹尾迹】、【AR 护球手闪电触靶】、【AR 边线折返 + 虚拟高空横杆下潜闪避】、【AR 扑防双手封盖干扰 + 假动作识别】以及赛后【左右手反应对称度与单次反应柱状曲线图】。
          files: build/HoopFlashPro-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: HoopFlashPro-Unsigned.ipa
          path: build/HoopFlashPro-Unsigned.ipa
          compression-level: 0
