              private func spawnNextTarget() {
                  let now = Date()
                  if mode == .defensiveSlide {
                      targetSideLeft.toggle()
                      let pos = CGPoint(x: targetSideLeft ? 0.20 : 0.80, y: 0.56)
                      let label = targetSideLeft ? "左侧滑步区" : "右侧滑步区"
                      activeCone = VirtualTargetCone(normalizedPosition: pos, label: label, isFakeBomb: false, spawnedAt: now)
                      statusBanner = targetSideLeft ? "向左压低重心横移滑步！" : "向右压低重心横移滑步！"
                      if store.voiceCoachEnabled {
                          SoundAndSpeechService.shared.speakCoach(targetSideLeft ? "左滑步" : "右滑步", rate: 0.58)
                      }
                  } else {
                      let pick = coneLocations.randomElement() ?? (CGPoint(x: 0.5, y: 0.3), "中路")
                      let isBomb = Double.random(in: 0...1) < difficulty.fakeBombProbability
                      activeCone = VirtualTargetCone(normalizedPosition: pick.0, label: pick.1, isFakeBomb: isBomb, spawnedAt: now)
                      statusBanner = isBomb ? "小心！红色假动作陷阱，切勿触碰！" : "快速伸手触碰：\(pick.1)"
                      if store.voiceCoachEnabled && !isBomb {
                          SoundAndSpeechService.shared.speakCoach(pick.1, rate: 0.60)
                      }
                  }
              }

              private func checkPoseCollisionAndTimeout() {
                  guard let cone = activeCone else { return }
                  let elapsedMs = Date().timeIntervalSince(cone.spawnedAt) * 1000.0

                  // Check timeout
                  if elapsedMs >= difficulty.targetTimeoutMs {
                      if cone.isFakeBomb {
                          // Successfully avoided fake bomb!
                          score += 60
                          hits += 1
                          combo += 1
                          maxCombo = max(maxCombo, combo)
                          statusBanner = "好眼力！成功识破假动作陷阱 +60"
                      } else {
                          misses += 1
                          combo = 0
                          if store.soundEffectsEnabled {
                              SoundAndSpeechService.shared.playMissOrBombSound()
                          }
                          statusBanner = "超时未触达！加快第一步启动速度！"
                      }
                      spawnNextTarget()
                      return
                  }

                  // Check AI Vision Body Pose Collision
                  if mode == .defensiveSlide {
                      if let centerX = visionService.joints.bodyCenterX {
                          let dist = abs(centerX - cone.normalizedPosition.x)
                          if dist < 0.16 && visionService.joints.isStanceLowEnough {
                              handleTargetTriggered(cone: cone)
                          }
                      }
                  } else {
                      for pt in visionService.joints.activeContactPoints {
                          let dx = pt.x - cone.normalizedPosition.x
                          let dy = pt.y - cone.normalizedPosition.y
                          let distance = sqrt(dx * dx + dy * dy)
                          if distance < 0.13 {
                              handleTargetTriggered(cone: cone)
                              break
                          }
                      }
                  }
              }

              private func handleTargetTriggered(cone: VirtualTargetCone) {
                  let reactionMs = max(120, Int(Date().timeIntervalSince(cone.spawnedAt) * 1000.0))

                  if cone.isFakeBomb {
                      misses += 1
                      combo = 0
                      score = max(0, score - 80)
                      statusBanner = "误触假动作陷阱！注意观察场上信号 (-80)"
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                  } else {
                      hits += 1
                      combo += 1
                      maxCombo = max(maxCombo, combo)
                      reactionTimesMs.append(reactionMs)
                      let speedBonus = max(20, Int((difficulty.targetTimeoutMs - Double(reactionMs)) / 12.0))
                      let gained = 100 + speedBonus + (combo * 15)
                      score += gained
                      statusBanner = "极速命中！反应 \(reactionMs)ms (+\(gained)分)"
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playHitSound(combo: combo)
                      }
                  }
                  spawnNextTarget()
              }

              private func finishWorkout() {
                  isPaused = true
                  visionService.stopSession()
                  let avgMs = reactionTimesMs.isEmpty ? 0 : (reactionTimesMs.reduce(0, +) / reactionTimesMs.count)
                  let bestMs = reactionTimesMs.min() ?? 0
                  let record = TrainingRecord(
                      id: UUID(),
                      date: Date(),
                      mode: mode,
                      difficulty: difficulty,
                      score: score,
                      hits: hits,
                      misses: misses,
                      avgReactionMs: avgMs,
                      bestReactionMs: bestMs,
                      maxCombo: maxCombo,
                      durationSeconds: 45
                  )
                  store.addRecord(record)
                  onFinish(record)
              }

              private func drawCourtOverlay(context: GraphicsContext, size: CGSize) {
                  var lanePath = Path()
                  let laneRect = CGRect(x: size.width * 0.12, y: size.height * 0.18, width: size.width * 0.76, height: size.height * 0.68)
                  lanePath.addRoundedRect(in: laneRect, cornerSize: CGSize(width: 24, height: 24))
                  context.stroke(lanePath, with: .color(.white.opacity(0.18)), style: StrokeStyle(lineWidth: 2, dash: [8, 6]))
              }

              private func drawSkeletonOverlay(context: GraphicsContext, size: CGSize) {
                  let j = visionService.joints
                  func toScreen(_ pt: CGPoint?) -> CGPoint? {
                      guard let p = pt else { return nil }
                      return CGPoint(x: p.x * size.width, y: p.y * size.height)
                  }

                  let pairs: [(CGPoint?, CGPoint?)] = [
                      (j.leftShoulder, j.rightShoulder),
                      (j.leftShoulder, j.leftWrist),
                      (j.rightShoulder, j.rightWrist),
                      (j.leftShoulder, j.rootHip),
                      (j.rightShoulder, j.rootHip),
                      (j.rootHip, j.leftKnee),
                      (j.rootHip, j.rightKnee)
                  ]

                  for (a, b) in pairs {
                      if let p1 = toScreen(a), let p2 = toScreen(b) {
                          var line = Path()
                          line.move(to: p1)
                          line.addLine(to: p2)
                          context.stroke(line, with: .color(.cyan.opacity(0.8)), lineWidth: 4)
                      }
                  }

                  for wrist in [j.leftWrist, j.rightWrist].compactMap({ toScreen($0) }) {
                      let rect = CGRect(x: wrist.x - 18, y: wrist.y - 18, width: 36, height: 36)
                      context.fill(Path(ellipseIn: rect), with: .color(.orange.opacity(0.85)))
                      context.stroke(Path(ellipseIn: rect), with: .color(.white), lineWidth: 3)
                  }
              }
          }
