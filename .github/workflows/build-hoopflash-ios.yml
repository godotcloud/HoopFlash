                                  .clipShape(RoundedRectangle(cornerRadius: 16))
                              }

                              HStack {
                                  Text("历史训练战报记录")
                                      .font(.system(size: 17, weight: .black))
                                      .foregroundColor(.white)
                                  Spacer()
                                  if !store.records.isEmpty {
                                      Button("清空记录") {
                                          store.clearRecords()
                                      }
                                      .font(.system(size: 13, weight: .semibold))
                                      .foregroundColor(.red)
                                  }
                              }

                              if store.records.isEmpty {
                                  Text("暂无训练记录，快去【特训中心】开启第一场篮球速度挑战吧！")
                                      .font(.system(size: 14))
                                      .foregroundColor(.white.opacity(0.65))
                                      .padding(24)
                                      .frame(maxWidth: .infinity)
                                      .background(Color.white.opacity(0.05))
                                      .clipShape(RoundedRectangle(cornerRadius: 16))
                              } else {
                                  ForEach(store.records) { rec in
                                      VStack(alignment: .leading, spacing: 6) {
                                          HStack {
                                              Text(rec.mode.rawValue)
                                                  .font(.system(size: 15, weight: .bold))
                                                  .foregroundColor(.white)
                                              Spacer()
                                              Text(rec.agilityRating)
                                                  .font(.system(size: 12, weight: .heavy))
                                                  .foregroundColor(.orange)
                                          }
                                          HStack(spacing: 14) {
                                              Text("得分: \(rec.score)")
                                              Text("命中: \(rec.hits)次 (\(rec.accuracyPercent)%)")
                                              if rec.avgReactionMs > 0 {
                                                  Text("平均反应: \(rec.avgReactionMs)ms")
                                              }
                                              Text("最高连击: x\(rec.maxCombo)")
                                          }
                                          .font(.system(size: 12, weight: .medium))
                                          .foregroundColor(.white.opacity(0.75))
                                      }
                                      .padding(14)
                                      .background(Color.white.opacity(0.06))
                                      .clipShape(RoundedRectangle(cornerRadius: 14))
                                  }
                              }
                          }
                          .padding(18)
                      }
                      .background(
                          LinearGradient(
                              colors: [Color(red: 0.05, green: 0.07, blue: 0.12), Color(red: 0.09, green: 0.12, blue: 0.20)],
                              startPoint: .top,
                              endPoint: .bottom
                          )
                          .ignoresSafeArea()
                      )
                      .navigationTitle("球员速度成长档案")
                      .navigationBarTitleDisplayMode(.inline)
                  }
                  .navigationViewStyle(.stack)
              }
          }

          struct WorkoutResultSheet: View {
              let record: TrainingRecord
              let onDismiss: () -> Void

              var body: some View {
                  VStack(spacing: 20) {
                      Image(systemName: "medal.star.fill")
                          .font(.system(size: 64))
                          .foregroundColor(.yellow)
                          .padding(.top, 24)

                      Text("特训完成！球探能力评级")
                          .font(.system(size: 16, weight: .bold))
                          .foregroundColor(.white.opacity(0.75))

                      Text(record.agilityRating)
                          .font(.system(size: 32, weight: .black, design: .rounded))
                          .foregroundColor(.orange)

                      VStack(spacing: 12) {
                          resultRow(label: "训练项目", value: record.mode.rawValue)
                          resultRow(label: "综合得分", value: "\(record.score) 分")
                          resultRow(label: "命中 / 准确率", value: "\(record.hits) 次 (\(record.accuracyPercent)%)")
                          resultRow(label: "平均神经反应耗时", value: record.avgReactionMs > 0 ? "\(record.avgReactionMs) 毫秒" : "节拍完成")
                          resultRow(label: "最快单次爆发反应", value: record.bestReactionMs > 0 ? "\(record.bestReactionMs) 毫秒" : "--")
                          resultRow(label: "最高连续命中 (Combo)", value: "x\(record.maxCombo)")
                      }
                      .padding(18)
                      .background(Color.white.opacity(0.08))
                      .clipShape(RoundedRectangle(cornerRadius: 18))
                      .padding(.horizontal, 20)

                      Button(action: onDismiss) {
                          Text("收下战报，继续突破！")
                              .font(.system(size: 17, weight: .black))
                              .foregroundColor(.black)
                              .frame(maxWidth: .infinity)
                              .frame(height: 54)
                              .background(Color.orange)
                              .clipShape(RoundedRectangle(cornerRadius: 16))
                      }
                      .padding(.horizontal, 20)

                      Spacer()
                  }
                  .background(Color(red: 0.06, green: 0.09, blue: 0.16).ignoresSafeArea())
              }

              private func resultRow(label: String, value: String) -> some View {
                  HStack {
                      Text(label)
                          .font(.system(size: 14, weight: .medium))
                          .foregroundColor(.white.opacity(0.7))
                      Spacer()
                      Text(value)
                          .font(.system(size: 15, weight: .bold))
                          .foregroundColor(.white)
                  }
              }
          }
          EOF

          # 10. Generate App Entry Point (HoopFlashProApp.swift)
          cat << 'EOF' > HoopFlashPro/Sources/HoopFlashProApp.swift
          import SwiftUI

          @main
          struct HoopFlashProApp: App {
              init() {
                  UIApplication.shared.isIdleTimerDisabled = true
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          EOF

          # 11. Generate project.yml for XcodeGen
          cat << 'EOF' > project.yml
          name: HoopFlashPro
          options:
            bundleIdPrefix: com.hoopflash.trainer
            deploymentTarget:
              iOS: "15.0"
          targets:
            HoopFlashPro:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - path: HoopFlashPro/Sources
              resources:
                - path: HoopFlashPro/Resources/Assets.xcassets
              info:
                path: HoopFlashPro/Resources/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hoopflash.trainer.app
                  INFOPLIST_FILE: HoopFlashPro/Resources/Info.plist
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
                  CODE_SIGN_IDENTITY: ""
                  CODE_SIGNING_REQUIRED: "NO"
                  CODE_SIGNING_ALLOWED: "NO"
                  ENABLE_BITCODE: "NO"
                  ENABLE_PREVIEWS: "NO"
          EOF

      - name: Generate Xcode Project with XcodeGen
        run: |
          xcodegen generate

      - name: Compile iOS Release Archive (Unsigned)
        run: |
          xcodebuild clean build \
            -project HoopFlashPro.xcodeproj \
            -scheme HoopFlashPro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned .ipa Bundle
        run: |
          mkdir -p build/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/HoopFlashPro.app build/Payload/
          cd build
          zip -r9 HoopFlashPro-Unsigned.ipa Payload
          ls -lh HoopFlashPro-Unsigned.ipa

      - name: Upload Direct Uncompressed IPA to GitHub Releases (No Outer Zip)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "HoopFlash 篮球敏捷特训 iOS v1.0.${{ github.run_number }} (直装免解压 .ipa)"
          body: |
            ### 🏀 HoopFlash Pro 青少年篮球速度与敏捷反应特训系统
            - **免解压直链下载**：直接点击下方 Assets 中的 `HoopFlashPro-Unsigned.ipa` 即可下载 `.ipa` 本体（无需二次解压 `.zip`），直接导入 **SideStore / AltStore / LiveContainer / Sideloadly / TrollStore** 安装。
            - **四大训练模块**：
              1. **AI 视觉摸锥闪电战**（Apple Vision 前置骨骼手腕追踪 + 四角爆发摸锥 + 假动作炸弹抑制）
              2. **AI 压低重心横移滑步**（实时髋膝高度检测 + 防守重心警报 + 边线碎步滑步）
              3. **球场反应灯决策特训**（3x3 战术灯光矩阵 + 绿灯单点/橙灯双击/红灯勿碰 + 语音口令）
              4. **高频碎步运球节拍器**（60-210 BPM 动态步频 + 抬头视野手指数字口令）
          files: build/HoopFlashPro-Unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: HoopFlashPro-Unsigned.ipa
          path: build/HoopFlashPro-Unsigned.ipa
          compression-level: 0
