                      .clipShape(RoundedRectangle(cornerRadius: 20))
                      .overlay(
                          RoundedRectangle(cornerRadius: 20)
                              .stroke(isCurrent ? Color.white : Color.white.opacity(0.12), lineWidth: isCurrent ? 3 : 1)
                      )
                      .shadow(color: isCurrent ? bgColor.opacity(0.8) : .clear, radius: 14)
                  }
                  .buttonStyle(.plain)
              }

              private func iconForPod(_ type: PodSignalType) -> String {
                  switch type {
                  case .driveGreen: return "bolt.fill"
                  case .crossoverOrange: return "flame.fill"
                  case .chargeFakeRed: return "hand.raised.slash.fill"
                  case .coachCallBlue: return "speaker.wave.3.fill"
                  }
              }

              private func handlePodTap(index: Int) {
                  guard var pod = activePod else { return }
                  if index != pod.index {
                      misses += 1
                      combo = 0
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                      coachInstruction = "拍错位置了！看准球场区域再出手！"
                      return
                  }

                  if pod.type == .chargeFakeRed {
                      misses += 1
                      combo = 0
                      score = max(0, score - 90)
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playMissOrBombSound()
                      }
                      coachInstruction = "误触红灯进攻犯规！克制盲目出手 (-90)"
                      spawnNextPod()
                      return
                  }

                  pod.tapsRemaining -= 1
                  if pod.tapsRemaining > 0 {
                      activePod = pod
                      if store.soundEffectsEnabled {
                          SoundAndSpeechService.shared.playHitSound(combo: combo)
                      }
                      return
                  }

                  let reactionMs = max(110, Int(Date().timeIntervalSince(pod.spawnedAt) * 1000.0))
                  reactionTimesMs.append(reactionMs)
                  hits += 1
                  combo += 1
                  maxCombo = max(maxCombo, combo)
                  let points = 110 + max(0, Int((difficulty.targetTimeoutMs - Double(reactionMs)) / 10.0)) + (combo * 12)
                  score += points
                  if store.soundEffectsEnabled {
                      SoundAndSpeechService.shared.playHitSound(combo: combo)
                  }
                  coachInstruction = "漂亮！\(courtZones[index]) 反应 \(reactionMs)ms (+\(points))"
                  spawnNextPod()
              }

              private func spawnNextPod() {
                  let nextIdx = Int.random(in: 0..<9)
                  let roll = Double.random(in: 0...1)
                  let type: PodSignalType
                  let prompt: String
                  let taps: Int

                  if roll < difficulty.fakeBombProbability {
                      type = .chargeFakeRed
                      prompt = "勿碰陷阱"
                      taps = 1
                      coachInstruction = "红灯陷阱！【\(courtZones[nextIdx])】切勿拍击！"
                  } else if roll < difficulty.fakeBombProbability + 0.28 {
                      type = .crossoverOrange
                      prompt = "双击变向x2"
                      taps = 2
                      coachInstruction = "橙色双变向！快速连点【\(courtZones[nextIdx])】2次！"
                      if store.voiceCoachEnabled {
                          SoundAndSpeechService.shared.speakCoach("双击\(courtZones[nextIdx])", rate: 0.60)
                      }
                  } else {
                      type = .driveGreen
                      prompt = "极速单点"
                      taps = 1
                      coachInstruction = "绿灯突破！立即点击【\(courtZones[nextIdx])】！"
                      if store.voiceCoachEnabled {
                          SoundAndSpeechService.shared.speakCoach(courtZones[nextIdx], rate: 0.60)
                      }
                  }

                  activePod = ActivePodState(
                      index: nextIdx,
                      type: type,
                      promptText: prompt,
                      spawnedAt: Date(),
                      tapsRemaining: taps
                  )
              }

              private func completeSession() {
                  isFinished = true
                  let avgMs = reactionTimesMs.isEmpty ? 0 : (reactionTimesMs.reduce(0, +) / reactionTimesMs.count)
                  let bestMs = reactionTimesMs.min() ?? 0
                  let record = TrainingRecord(
                      id: UUID(),
                      date: Date(),
                      mode: .courtPodReflex,
                      difficulty: difficulty,
                      score: score,
                      hits: hits,
                      misses: misses,
                      avgReactionMs: avgMs,
                      bestReactionMs: bestMs,
                      maxCombo: maxCombo,
                      durationSeconds: 45
                  )
                  store.addRecord(record)
                  onFinish(record)
              }

              private func statPill(label: String, value: String, color: Color) -> some View {
                  VStack(spacing: 4) {
                      Text(label)
                          .font(.system(size: 11, weight: .medium))
                          .foregroundColor(.white.opacity(0.65))
                      Text(value)
                          .font(.system(size: 20, weight: .black, design: .rounded))
                          .foregroundColor(color)
                  }
                  .frame(maxWidth: .infinity)
                  .padding(.vertical, 10)
                  .background(Color.white.opacity(0.06))
                  .clipShape(RoundedRectangle(cornerRadius: 14))
              }

              private func legendItem(color: Color, text: String) -> some View {
                  HStack(spacing: 5) {
                      Circle()
                          .fill(color)
                          .frame(width: 10, height: 10)
                      Text(text)
                  }
              }
          }
