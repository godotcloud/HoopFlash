name: Build Basketball Speed Trainer iOS App (HoopFlash Pro)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned iOS IPA (Zero-Unzip Direct Download)
    runs-on: macos-15
    steps:
      - name: Checkout Repository (Optional)
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Project Structure & Swift Source Code
        run: |
          mkdir -p HoopFlashPro/Sources/Models
          mkdir -p HoopFlashPro/Sources/Services
          mkdir -p HoopFlashPro/Sources/Views
          mkdir -p HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset

          # 1. Generate Info.plist
          cat << 'EOF' > HoopFlashPro/Resources/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>zh_CN</string>
              <key>CFBundleDisplayName</key>
              <string>HoopFlash篮球特训</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSCameraUsageDescription</key>
              <string>需要使用前置摄像头进行AI人体骨骼姿态追踪（Apple Vision），实时检测您的防守滑步、压低重心与敏捷摸锥动作，所有图像均在本地实时处理，绝不上传或保存。</string>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <false/>
              </dict>
              <key>UILaunchScreen</key>
              <dict>
                  <key>UIColorName</key>
                  <string>AccentColor</string>
              </dict>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF

          # 2. Generate Programmatic Basketball App Icon using Swift
          cat << 'EOF' > generate_icon.swift
          import AppKit

          let size = CGSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          guard let ctx = NSGraphicsContext.current?.cgContext else { exit(1) }

          // Dark Court Background Gradient
          let colorSpace = CGColorSpaceCreateDeviceRGB()
          let bgColors = [
              CGColor(red: 0.06, green: 0.08, blue: 0.14, alpha: 1.0),
              CGColor(red: 0.12, green: 0.16, blue: 0.26, alpha: 1.0)
          ] as CFArray
          if let gradient = CGGradient(colorsSpace: colorSpace, colors: bgColors, locations: [0.0, 1.0]) {
              ctx.drawLinearGradient(gradient, start: CGPoint(x: 0, y: 1024), end: CGPoint(x: 1024, y: 0), options: [])
          }

          // Neon Speed Ring
          ctx.setStrokeColor(CGColor(red: 0.0, green: 0.90, blue: 1.0, alpha: 0.85))
          ctx.setLineWidth(28)
          ctx.strokeEllipse(in: CGRect(x: 112, y: 112, width: 800, height: 800))

          // Basketball Sphere
          let ballRect = CGRect(x: 212, y: 212, width: 600, height: 600)
          let ballColors = [
              CGColor(red: 1.0, green: 0.55, blue: 0.10, alpha: 1.0),
              CGColor(red: 0.85, green: 0.28, blue: 0.02, alpha: 1.0)
          ] as CFArray
          ctx.saveGState()
          ctx.addEllipse(in: ballRect)
          ctx.clip()
          if let ballGrad = CGGradient(colorsSpace: colorSpace, colors: ballColors, locations: [0.0, 1.0]) {
              ctx.drawRadialGradient(ballGrad, startCenter: CGPoint(x: 420, y: 620), startRadius: 50, endCenter: CGPoint(x: 512, y: 512), endRadius: 340, options: [])
          }
          // Basketball Seams
          ctx.setStrokeColor(CGColor(red: 0.1, green: 0.1, blue: 0.12, alpha: 0.9))
          ctx.setLineWidth(18)
          ctx.move(to: CGPoint(x: 212, y: 512))
          ctx.addLine(to: CGPoint(x: 812, y: 512))
          ctx.move(to: CGPoint(x: 512, y: 212))
          ctx.addLine(to: CGPoint(x: 512, y: 812))
          ctx.strokePath()
          ctx.strokeEllipse(in: CGRect(x: 80, y: 312, width: 360, height: 400))
          ctx.strokeEllipse(in: CGRect(x: 584, y: 312, width: 360, height: 400))
          ctx.restoreGState()

          // Lightning Bolt Overlay
          ctx.saveGState()
          ctx.setFillColor(CGColor(red: 1.0, green: 0.95, blue: 0.25, alpha: 1.0))
          ctx.beginPath()
          ctx.move(to: CGPoint(x: 560, y: 780))
          ctx.addLine(to: CGPoint(x: 370, y: 500))
          ctx.addLine(to: CGPoint(x: 500, y: 500))
          ctx.addLine(to: CGPoint(x: 440, y: 240))
          ctx.addLine(to: CGPoint(x: 660, y: 535))
          ctx.addLine(to: CGPoint(x: 525, y: 535))
          ctx.closePath()
          ctx.fillPath()
          ctx.restoreGState()

          image.unlockFocus()

          if let tiffData = image.tiffRepresentation,
             let bitmap = NSBitmapImageRep(data: tiffData),
             let pngData = bitmap.representation(using: .png, properties: [:]) {
              try? pngData.write(to: URL(fileURLWithPath: "HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png"))
          }
          EOF
          swift generate_icon.swift
          rm -f generate_icon.swift

          cat << 'EOF' > HoopFlashPro/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          cat << 'EOF' > HoopFlashPro/Resources/Assets.xcassets/Contents.json
          {
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

          # 3. Generate Models/DrillModels.swift
          cat << 'EOF' > HoopFlashPro/Sources/Models/DrillModels.swift
          import Foundation
          import SwiftUI

          enum DrillMode: String, CaseIterable, Identifiable, Codable {
              case visionConeBlast = "AI 视觉摸锥闪电战"
              case defensiveSlide = "AI 压低重心横移滑步"
              case courtPodReflex = "球场反应灯决策特训"
              case dribbleRhythm = "高频碎步运球节拍器"

              var id: String { rawValue }

              var subtitle: String {
                  switch self {
                  case .visionConeBlast:
                      return "前置摄像头AI骨骼追踪 • 四角虚拟标志桶极速触碰"
                  case .defensiveSlide:
                      return "实时监测髋膝重心高度 • 左右防守横移滑步训练"
                  case .courtPodReflex:
                      return "3x3 球场反应灯矩阵 • 抗假动作干扰与色彩口令挑战"
                  case .dribbleRhythm:
                      return "60-200 BPM 动态加速 • 碎步频率与抬头视野数字口令"
                  }
              }

              var iconName: String {
                  switch self {
                  case .visionConeBlast: return "figure.basketball"
                  case .defensiveSlide: return "arrow.left.and.right.circle.fill"
                  case .courtPodReflex: return "square.grid.3x3.fill"
                  case .dribbleRhythm: return "metronome.fill"
                  }
              }

              var themeColor: Color {
                  switch self {
                  case .visionConeBlast: return Color(red: 1.0, green: 0.45, blue: 0.1)
                  case .defensiveSlide: return Color(red: 0.0, green: 0.82, blue: 0.95)
                  case .courtPodReflex: return Color(red: 0.2, green: 0.9, blue: 0.45)
                  case .dribbleRhythm: return Color(red: 0.75, green: 0.35, blue: 1.0)
                  }
              }

              var coachingTips: [String] {
                  switch self {
                  case .visionConeBlast:
                      return [
                          "将手机竖屏放置在身前约 1.8~2.5 米处，确保全身或上半身入镜",
                          "当屏幕四角亮起发光篮球靶标时，快速跨步伸手触碰对应空间位置",
                          "遇到红色【假动作炸弹】千万不要触碰，训练球场阅读与急停控制力"
                      ]
                  case .defensiveSlide:
                      return [
                          "保持篮球标准防守姿态（Defensive Stance）：屈膝降臀、抬头挺胸、双臂张开",
                          "AI 会实时计算您的髋关节与肩部高度，重心过高会触发【重心过高警报】",
                          "跟随屏幕左右两侧交替亮起的边线信标，用碎步滑步让身体中心进入目标区"
                      ]
                  case .courtPodReflex:
                      return [
                          "将手机平放在身前地面或支架上，双手准备随时拍击屏幕反应灯",
                          "绿色【突破靶】立即单次点击；橙色【双胯下靶】快速双击；红色【进攻犯规陷阱】禁止触碰",
                          "开启语音指令模式后，耳朵听口令、眼睛看颜色，锻炼赛场多线程专注力"
                      ]
                  case .dribbleRhythm:
                      return [
                          "跟随电子合成节拍器与语音口令，在原地进行高频碎步（Quick Feet）或低手运球",
                          "不要低头看球！眼睛紧盯屏幕中央随时闪现的【手指数字】，并大声喊出数字",
                          "节拍将从基础速度逐步推进至职业级爆发步频，培养肌肉记忆与抬头观察习惯"
                      ]
                  }
              }
          }

          enum DifficultyTier: String, CaseIterable, Identifiable, Codable {
              case rookie = "新秀级 (U8-U10)"
              case allStar = "全明星 (U11-U13)"
              case mvp = "MVP职业级 (U14+)"

              var id: String { rawValue }

              var targetTimeoutMs: Double {
                  switch self {
                  case .rookie: return 2200
                  case .allStar: return 1550
                  case .mvp: return 1050
                  }
              }

              var fakeBombProbability: Double {
                  switch self {
                  case .rookie: return 0.12
                  case .allStar: return 0.22
                  case .mvp: return 0.32
                  }
              }

              var baseBPM: Int {
                  switch self {
                  case .rookie: return 100
                  case .allStar: return 135
                  case .mvp: return 165
                  }
              }
          }

          struct TrainingRecord: Identifiable, Codable {
              let id: UUID
              let date: Date
              let mode: DrillMode
              let difficulty: DifficultyTier
              let score: Int
              let hits: Int
              let misses: Int
              let avgReactionMs: Int
              let bestReactionMs: Int
              let maxCombo: Int
              let durationSeconds: Int

              var accuracyPercent: Int {
                  let total = hits + misses
                  guard total > 0 else { return 100 }
                  return Int((Double(hits) / Double(total)) * 100.0)
              }

              var agilityRating: String {
                  if avgReactionMs <= 0 { return "B" }
                  if avgReactionMs < 380 && accuracyPercent >= 90 { return "SSS 闪电侠" }
                  if avgReactionMs < 480 && accuracyPercent >= 85 { return "SS 全明星后卫" }
                  if avgReactionMs < 620 && accuracyPercent >= 75 { return "S 精英先发" }
                  if avgReactionMs < 800 { return "A 潜力新星" }
                  return "B 扎实成长"
              }
          }

          struct AchievementBadge: Identifiable {
              let id: String
              let title: String
              let description: String
              let icon: String
              let isUnlocked: Bool
              let accent: Color
          }

          @MainActor
          final class TrainingStore: ObservableObject {
              @Published var records: [TrainingRecord] = []
              @Published var playerName: String = "篮球小飞侠"
              @Published var voiceCoachEnabled: Bool = true
              @Published var soundEffectsEnabled: Bool = true

              private let storageKey = "hoopflash.training.records.v1"
              private let nameKey = "hoopflash.player.name.v1"

              init() {
                  load()
              }

              func addRecord(_ record: TrainingRecord) {
                  records.insert(record, at: 0)
                  if records.count > 100 {
                      records = Array(records.prefix(100))
                  }
                  save()
              }

              func clearRecords() {
                  records.removeAll()
                  save()
              }

              var totalSessions: Int { records.count }

              var totalHits: Int { records.reduce(0) { $0 + $1.hits } }

              var bestReactionEverMs: Int {
                  let valid = records.map { $0.bestReactionMs }.filter { $0 > 0 }
                  return valid.min() ?? 0
              }

              var averageReactionRecentMs: Int {
                  let recent = records.prefix(10).map { $0.avgReactionMs }.filter { $0 > 0 }
                  guard !recent.isEmpty else { return 0 }
                  return recent.reduce(0, +) / recent.count
              }

              var xpLevel: Int {
                  max(1, (totalHits / 25) + 1)
              }

              var xpProgress: Double {
                  Double(totalHits % 25) / 25.0
              }

              var badges: [AchievementBadge] {
                  [
                      AchievementBadge(
                          id: "first_step",
                          title: "第一步爆发",
                          description: "完成首次篮球速度与反应训练",
                          icon: "flame.fill",
                          isUnlocked: totalSessions >= 1,
                          accent: .orange
                      ),
                      AchievementBadge(
                          id: "lightning_reflex",
                          title: "0.35秒超神反射",
                          description: "单次最佳反应速度突破 350 毫秒以内",
                          icon: "bolt.circle.fill",
                          isUnlocked: bestReactionEverMs > 0 && bestReactionEverMs <= 350,
                          accent: .yellow
                      ),
                      AchievementBadge(
                          id: "combo_king",
                          title: "零失误脚踝终结者",
                          description: "单局达成 15 次以上连续命中（Combo >= 15）",
                          icon: "crown.fill",
                          isUnlocked: records.contains(where: { $0.maxCombo >= 15 }),
                          accent: .cyan
                      ),
                      AchievementBadge(
                          id: "iron_defense",
                          title: "DPOY 最佳防守铁闸",
                          description: "在 AI 压低重心横移滑步模式中得分突破 1200 分",
                          icon: "shield.lefthalf.filled",
                          isUnlocked: records.contains(where: { $0.mode == .defensiveSlide && $0.score >= 1200 }),
                          accent: .green
                      ),
                      AchievementBadge(
                          id: "hundred_hits",
                          title: "百次触球里程碑",
                          description: "累计成功完成 100 次高速敏捷反应动作",
                          icon: "medal.fill",
                          isUnlocked: totalHits >= 100,
                          accent: .purple
                      )
                  ]
              }

              func save() {
                  if let encoded = try? JSONEncoder().encode(records) {
                      UserDefaults.standard.set(encoded, forKey: storageKey)
                  }
                  UserDefaults.standard.set(playerName, forKey: nameKey)
              }

              private func load() {
                  if let savedName = UserDefaults.standard.string(forKey: nameKey), !savedName.isEmpty {
                      playerName = savedName
                  }
                  guard let data = UserDefaults.standard.data(forKey: storageKey),
                        let decoded = try? JSONDecoder().decode([TrainingRecord].self, from: data) else {
                      return
                  }
                  records = decoded
              }
          }
          EOF

          # 4. Generate Services/SoundAndSpeechService.swift
          cat << 'EOF' > HoopFlashPro/Sources/Services/SoundAndSpeechService.swift
          import Foundation
          import AVFoundation
          import UIKit

          final class SoundAndSpeechService {
              static let shared = SoundAndSpeechService()

              private let synthesizer = AVSpeechSynthesizer()
              private var audioEngine: AVAudioEngine?
              private var playerNode: AVAudioPlayerNode?
              private let audioFormat = AVAudioFormat(standardFormatWithSampleRate: 44100, channels: 1)!

              private init() {
                  setupAudioEngine()
              }

              private func setupAudioEngine() {
                  let engine = AVAudioEngine()
                  let node = AVAudioPlayerNode()
                  engine.attach(node)
                  engine.connect(node, to: engine.mainMixerNode, format: audioFormat)
                  do {
                      try AVAudioSession.sharedInstance().setCategory(.playback, mode: .default, options: [.mixWithOthers])
                      try AVAudioSession.sharedInstance().setActive(true)
                      try engine.start()
                      self.audioEngine = engine
                      self.playerNode = node
                  } catch {
                      print("AudioEngine setup error: \(error)")
                  }
              }

              func playTone(frequency: Double, durationMs: Double, volume: Float = 0.45, isSquare: Bool = false) {
                  guard let engine = audioEngine, let node = playerNode else { return }
                  if !engine.isRunning {
                      try? engine.start()
                  }
                  let sampleRate = audioFormat.sampleRate
                  let frameCount = AVAudioFrameCount((durationMs / 1000.0) * sampleRate)
                  guard let buffer = AVAudioPCMBuffer(pcmFormat: audioFormat, frameCapacity: frameCount) else { return }
                  buffer.frameLength = frameCount

                  guard let channelData = buffer.floatChannelData?[0] else { return }
                  for i in 0..<Int(frameCount) {
                      let t = Double(i) / sampleRate
                      let envelope = Float(max(0.0, 1.0 - (Double(i) / Double(frameCount))))
                      let rawWave = sin(2.0 * .pi * frequency * t)
                      let sample: Float
                      if isSquare {
                          sample = (rawWave >= 0 ? 1.0 : -1.0) * volume * envelope
                      } else {
                          sample = Float(rawWave) * volume * envelope
                      }
                      channelData[i] = sample
                  }

                  node.scheduleBuffer(buffer, at: nil, options: .interrupts, completionHandler: nil)
                  if !node.isPlaying {
                      node.play()
                  }
              }

              func playHitSound(combo: Int) {
                  let baseFreq = min(1320.0, 587.33 + Double(combo * 35))
                  playTone(frequency: baseFreq, durationMs: 85, volume: 0.5)
                  let generator = UIImpactFeedbackGenerator(style: .rigid)
                  generator.impactOccurred()
              }

              func playMissOrBombSound() {
                  playTone(frequency: 155.0, durationMs: 220, volume: 0.6, isSquare: true)
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.error)
              }

              func playMetronomeTick(isAccent: Bool) {
                  let freq = isAccent ? 987.77 : 659.25
                  playTone(frequency: freq, durationMs: 42, volume: isAccent ? 0.55 : 0.35)
              }

              func speakCoach(_ phrase: String, rate: Float = 0.56) {
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
                  let utterance = AVSpeechUtterance(string: phrase)
                  utterance.voice = AVSpeechSynthesisVoice(language: "zh-CN")
                  utterance.rate = rate
                  utterance.pitchMultiplier = 1.08
                  utterance.volume = 0.95
                  synthesizer.speak(utterance)
              }

              func stopSpeech() {
                  if synthesizer.isSpeaking {
                      synthesizer.stopSpeaking(at: .immediate)
                  }
              }
          }
          EOF

          # 5. Generate Services/VisionPoseService.swift (Added import SwiftUI for UIViewRepresentable & Context)
          cat << 'EOF' > HoopFlashPro/Sources/Services/VisionPoseService.swift
          import Foundation
          import AVFoundation
          import Vision
          import CoreGraphics
          import UIKit
          import SwiftUI

          struct DetectedBodyJoints {
              var leftWrist: CGPoint?
              var rightWrist: CGPoint?
              var nose: CGPoint?
              var leftShoulder: CGPoint?
              var rightShoulder: CGPoint?
              var rootHip: CGPoint?
              var leftKnee: CGPoint?
              var rightKnee: CGPoint?

              /// Normalized body center X (0.0 left to 1.0 right in mirrored front-camera view)
              var bodyCenterX: CGFloat? {
                  if let ls = leftShoulder, let rs = rightShoulder {
                      return (ls.x + rs.x) * 0.5
                  }
                  if let hip = rootHip {
                      return hip.x
                  }
                  return nose?.x
              }

              /// Estimates whether player is in a low athletic stance (0.0 = standing tall, 1.0 = deep stance)
              var stanceLowScore: CGFloat {
                  guard let nosePt = nose else { return 0.5 }
                  // In normalized screen space (0 = top, 1 = bottom), lower stance means nose/shoulders move down (larger Y)
                  let clamped = max(0.0, min(1.0, (nosePt.y - 0.22) / 0.35))
                  return clamped
              }

              var isStanceLowEnough: Bool {
                  stanceLowScore >= 0.32
              }

              var activeContactPoints: [CGPoint] {
                  [leftWrist, rightWrist, nose].compactMap { $0 }
              }
          }

          final class VisionPoseService: NSObject, ObservableObject, AVCaptureVideoDataOutputSampleBufferDelegate {
              @Published var joints = DetectedBodyJoints()
              @Published var isCameraAuthorized: Bool = false
              @Published var cameraErrorMessage: String? = nil

              let captureSession = AVCaptureSession()
              private let videoQueue = DispatchQueue(label: "com.hoopflash.vision.videoQueue", qos: .userInteractive)
              private var isConfigured = false

              func requestPermissionAndStart() {
                  switch AVCaptureDevice.authorizationStatus(for: .video) {
                  case .authorized:
                      DispatchQueue.main.async { self.isCameraAuthorized = true }
                      startSession()
                  case .notDetermined:
                      AVCaptureDevice.requestAccess(for: .video) { [weak self] granted in
                          DispatchQueue.main.async {
                              self?.isCameraAuthorized = granted
                              if !granted {
                                  self?.cameraErrorMessage = "未授予相机权限，已自动启用触屏模拟追踪模式（您可直接点击或拖动屏幕上的虚拟球员与靶标进行训练）。"
                              }
                          }
                          if granted {
                              self?.startSession()
                          }
                      }
                  default:
                      DispatchQueue.main.async {
                          self.isCameraAuthorized = false
                          self.cameraErrorMessage = "相机权限未开启，当前运行在触屏交互模式下。"
                      }
                  }
              }

              func startSession() {
                  videoQueue.async { [weak self] in
                      guard let self = self else { return }
                      if !self.isConfigured {
                          self.configureSession()
                      }
                      if !self.captureSession.isRunning && self.isConfigured {
                          self.captureSession.startRunning()
                      }
                  }
              }

              func stopSession() {
                  videoQueue.async { [weak self] in
                      guard let self = self else { return }
                      if self.captureSession.isRunning {
                          self.captureSession.stopRunning()
                      }
                  }
              }

              private func configureSession() {
                  captureSession.beginConfiguration()
                  captureSession.sessionPreset = .vga640x480

                  guard let device = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: .front),
                        let input = try? AVCaptureDeviceInput(device: device),
                        captureSession.canAddInput(input) else {
                      captureSession.commitConfiguration()
                      DispatchQueue.main.async {
                          self.cameraErrorMessage = "未检测到前置摄像头，已切换至触控交互训练模式。"
                      }
                      return
                  }
                  captureSession.addInput(input)

                  let output = AVCaptureVideoDataOutput()
                  output.alwaysDiscardsLateVideoFrames = true
                  output.setSampleBufferDelegate(self, queue: videoQueue)

                  if captureSession.canAddOutput(output) {
                      captureSession.addOutput(output)
                      if let connection = output.connection(with: .video) {
                          if connection.isVideoOrientationSupported {
                              connection.videoOrientation = .portrait
                          }
                          if connection.isVideoMirroringSupported {
                              connection.isVideoMirrored = true
                          }
                      }
                      isConfigured = true
                  }
                  captureSession.commitConfiguration()
              }

              func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
                  guard let pixelBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }

                  let request = VNDetectHumanBodyPoseRequest()
                  let handler = VNImageRequestHandler(cvPixelBuffer: pixelBuffer, orientation: .up, options: [:])
                  do {
                      try handler.perform([request])
                      guard let observation = request.results?.first else { return }
                      let parsed = extractJoints(from: observation)
                      DispatchQueue.main.async {
                          self.joints = parsed
                      }
                  } catch {
                      // Ignore single-frame pose errors
                  }
              }

              private func extractJoints(from observation: VNHumanBodyPoseObservation) -> DetectedBodyJoints {
                  var result = DetectedBodyJoints()
                  guard let points = try? observation.recognizedPoints(.all) else { return result }

                  func convert(_ key: VNHumanBodyPoseObservation.JointName, minConfidence: Float = 0.25) -> CGPoint? {
                      guard let pt = points[key], pt.confidence >= minConfidence else { return nil }
                      // Vision coordinates have origin at bottom-left; convert to SwiftUI top-left (0...1)
                      return CGPoint(x: CGFloat(pt.location.x), y: CGFloat(1.0 - pt.location.y))
                  }

                  result.leftWrist = convert(.leftWrist)
                  result.rightWrist = convert(.rightWrist)
                  result.nose = convert(.nose)
                  result.leftShoulder = convert(.leftShoulder)
                  result.rightShoulder = convert(.rightShoulder)
                  result.rootHip = convert(.root)
                  result.leftKnee = convert(.leftKnee)
                  result.rightKnee = convert(.rightKnee)
                  return result
              }
          }

          struct CameraPreviewLayerView: UIViewRepresentable {
              let session: AVCaptureSession

              func makeUIView(context: Context) -> PreviewUIView {
                  let view = PreviewUIView()
                  view.backgroundColor = .black
                  view.videoPreviewLayer.session = session
                  view.videoPreviewLayer.videoGravity = .resizeAspectFill
                  return view
              }

              func updateUIView(_ uiView: PreviewUIView, context: Context) {
                  if uiView.videoPreviewLayer.session !== session {
                      uiView.videoPreviewLayer.session = session
                  }
              }

              final class PreviewUIView: UIView {
                  override class var layerClass: AnyClass {
                      AVCaptureVideoPreviewLayer.self
                  }
                  var videoPreviewLayer: AVCaptureVideoPreviewLayer {
                      layer as! AVCaptureVideoPreviewLayer
                  }
              }
          }
